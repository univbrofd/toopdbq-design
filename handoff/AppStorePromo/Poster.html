<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poster v6 — App Store ポスター（Timeline · tall）</title>

<!-- foundation: DS tokens (colors / type / fonts) — 複製しない -->
<link rel="stylesheet" href="../../DesignSystem/colors_and_type.css" />

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; }
body { background: #101014; color: var(--text-1); font-family: var(--font-latin);
  -webkit-font-smoothing: antialiased; }
a { color: var(--text-1); } a:hover { color: #fff; }

/* ---- studio chrome ------------------------------------------------------ */
.studio { min-height: 100vh; padding: 42px 40px 80px; display: flex; flex-direction: column; gap: 34px; }
.set { display: flex; flex-direction: column; gap: 14px; }
.set > h2 { font-family: var(--font-latin); font-weight: 600; font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: rgba(255,255,255,.5); }
.set .row { display: flex; gap: 28px; overflow-x: auto; padding: 4px 4px 22px; }
.abwrap { display: flex; flex-direction: column; gap: 9px; flex: none; }
.ab-id { font-family: var(--font-latin); font-size: 10px; letter-spacing: .06em;
  color: rgba(255,255,255,.38); font-variant-numeric: tabular-nums; }

/* =======================================================================
   TALL SET (v6) — 黒地（下半分に DS の colorful 線形グラデーションを逆順 315° で濃く透過 = 斜めに変化）・
   上 176px がコピー帯（補足 1 行 → 見出し 2 行・白）／その下に実機スクリーン
   ショットを丸ごと（筐体なし・下端まで面内）。画面 = 344×744 で面の約 61%。
   ===================================================================== */
.ab { position: relative; overflow: hidden; flex: none; isolation: isolate; }
.ab.tall { width: var(--pw, 440px); height: var(--ph, 956px); background: #000; color: #fff; font-family: var(--font-jp); }
/* 6.5″ 用（1284×2778 @3x = 428×926）。`?size=65` で #tallstudio に .s65 が付く */
.s65 .ab.tall { --pw: 428px; --ph: 926px; --band: 172px; --sub: 21px; --h1: 46px; --lh: 50px;
  --sx: 47px; --sy: 188px; --sw: 334px; --sh: 722px; --sr: 45px; }
/* 下半分にだけ現れる透過グラデーション（上端 45% までは完全な黒のまま）。
   配色は DS の 135° を逆順にする = 要素ごと 180° 回して（色の複製を避ける）、
   マスクも回転後に下側が残る向き（0deg）で指定する */
.ab.tall::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: var(--gradient-colorful-linear); opacity: .78; transform: rotate(180deg);
  -webkit-mask-image: linear-gradient(0deg, rgba(0,0,0,0) 45%, #000 100%);
  mask-image: linear-gradient(0deg, rgba(0,0,0,0) 45%, #000 100%); }
.ab.tall .tband { position: absolute; z-index: 8; left: 24px; right: 24px; top: 0; height: var(--band, 176px);
  padding-top: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; }
.ab.tall .tq { font-family: var(--font-jp); font-weight: 700; font-size: var(--sub, 22px); line-height: 1.3;
  letter-spacing: .01em; color: #fff; }
.ab.tall .th { font-family: var(--font-jp); font-weight: 900; font-size: var(--h1, 48px); line-height: var(--lh, 52px);
  letter-spacing: -.02em; color: #fff; }
.ab.tall .th .ln { display: block; white-space: nowrap; }
/* accent = 1 面 1 語。色は面ごとにグラデーションの 4 色を順に（1 面目 = ピンク → teal → yellow → golden） */
.ab.tall .th em { font-style: normal; color: var(--accent, var(--grad-pink)); }
.ab.tall[data-accent="pink"]   { --accent: var(--grad-pink); }
.ab.tall[data-accent="teal"]   { --accent: var(--grad-teal); }
.ab.tall[data-accent="yellow"] { --accent: var(--grad-yellow); }
.ab.tall[data-accent="golden"] { --accent: var(--grad-golden); }
.ab.tall[data-lang="en"] .tq { font-family: var(--font-latin); font-weight: 700; font-size: 22px; }
.ab.tall[data-lang="en"] .th { font-family: var(--font-latin); font-size: 42px; line-height: 48px;
  letter-spacing: -.02em; }
/* 実機画面 — 全体を面内に収める（切らない・拡大しない） */
.ab.tall .scr { position: absolute; z-index: 6; left: var(--sx, 48px); top: var(--sy, 192px); width: var(--sw, 344px);
  height: var(--sh, 744px); border-radius: var(--sr, 46px); overflow: hidden; background: #111;
  box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 30px 80px rgba(0,0,0,.7); }
.ab.tall .scr img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#000"/><rect y="55" width="100" height="45" fill="#ff3e88" opacity=".5"/><rect x="26" y="8" width="48" height="5" rx="2.5" fill="#fff" opacity=".8"/><rect x="18" y="17" width="64" height="8" rx="4" fill="#fff"/><rect x="18" y="29" width="30" height="8" rx="4" fill="#ff3e88"/><rect x="24" y="46" width="52" height="60" rx="9" fill="#f7f3ec"/><rect x="24" y="46" width="52" height="30" rx="9" fill="#cfd8c8"/></svg>
</template>
</head>
<body>

<div class="studio" id="tallstudio">
  <section class="set">
    <h2>Poster v6 · tall — iPhone 6.9″ · ja — 440×956 · export 1320×2868 @3x</h2>
    <div class="row">
      <div class="abwrap">
        <span class="ab-id">tall-ja-01 · home</span>
        <div class="ab tall" id="tall-ja-01" data-lang="ja" data-accent="pink" data-device="iphone"
             data-screen-label="tall-ja-01 · home">
          <div class="tband">
            <p class="tq">地図でつながる街の投稿</p>
            <h1 class="th"><span class="ln"><em>この街</em>、</span><span class="ln">何がある？</span></h1>
          </div>
          <div class="scr"><img src="shots/v6/01-home-ja.png" alt="ホーム: 渋谷スクランブルの地図と投稿" /></div>
        </div>
      </div>
      <div class="abwrap">
        <span class="ab-id">tall-ja-02 · place</span>
        <div class="ab tall" id="tall-ja-02" data-lang="ja" data-accent="teal" data-device="iphone"
             data-screen-label="tall-ja-02 · place">
          <div class="tband">
            <p class="tq">同じ場所の投稿が集まる</p>
            <h1 class="th"><span class="ln">気になる店の</span><span class="ln"><em>雰囲気</em>まで。</span></h1>
          </div>
          <div class="scr"><img src="shots/v6/02-place-ja.png" alt="場所モード: 店の吹き出しカードとその場所の投稿" /></div>
        </div>
      </div>
      <div class="abwrap">
        <span class="ab-id">tall-ja-03 · board</span>
        <div class="ab tall" id="tall-ja-03" data-lang="ja" data-accent="yellow" data-device="iphone"
             data-screen-label="tall-ja-03 · board">
          <div class="tband">
            <p class="tq">投稿すると答えが見える</p>
            <h1 class="th"><span class="ln">同じ<em>お題</em>で、</span><span class="ln">街とつながる</span></h1>
          </div>
          <div class="scr"><img src="shots/v6/03-board-ja.png" alt="クエストボード: お題「ウィンクして」とみんなの投稿" /></div>
        </div>
      </div>
      <div class="abwrap">
        <span class="ab-id">tall-ja-04 · full</span>
        <div class="ab tall" id="tall-ja-04" data-lang="ja" data-accent="golden" data-device="iphone"
             data-screen-label="tall-ja-04 · full">
          <div class="tband">
            <p class="tq">投稿をタップして全画面へ</p>
            <h1 class="th"><span class="ln">写真も動画も</span><span class="ln">その場に<em>浸る</em></span></h1>
          </div>
          <div class="scr"><img src="shots/v6/04-full-ja.png" alt="全画面表示: 投稿の動画といいね・コメント・共有" /></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
/* ?ab=tall-ja-02 のように 1 面だけ描画できる（scripts/design/poster_export.mjs が使う）。
   ?size=65 で 6.5″（428×926 → 1284×2778 @3x）の寸法に切り替える。 */
(function () {
  var qs = /[?&]size=(\d+)/i.exec(location.search);
  if (qs && qs[1] === '65') document.getElementById('tallstudio').classList.add('s65');
  var qa = /[?&]ab=([a-z0-9-]+)/i.exec(location.search);
  if (!qa) return;
  var keep = qa[1].toLowerCase();
  document.querySelectorAll('#tallstudio .abwrap').forEach(function (w) {
    if (w.querySelector('.ab').id.toLowerCase() !== keep) w.remove();
  });
})();
</script>
</body>
</html>
