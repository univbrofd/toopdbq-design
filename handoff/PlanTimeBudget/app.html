<!-- @dsCard group="PlanTimeBudget" name="PlanTimeBudget — 実機で動くデモ" subtitle="スマホで開くと全画面で動く。時間帯 → 予算 の順にダイアログが出て、決定すると中央の大きな玉に 🕐 / 💰 の答えの泡が入る。答えの泡を押すと今の値入りで決め直し（裏を押すと閉じる）" viewport="402x874" -->
<!--
  実機デモ — time-final.html と budget-a.html を ?embed で全画面の iframe に出し、決定 / 取り消しを postMessage で受けて流れをつなぐ。
  - 402×874 の画面を端末の幅か高さに合わせて縮尺（PTB.device）。操作は pointer events なのでタッチでそのまま動く。
  - 端末のダーク / ライトに追従（?theme=dark|light で固定）。予算のデータは ?data=A〜E（既定 A）。
  - 実際のヒアリングでは時間帯と予算の間に「好みの段」が入る。デモでは省いて続けて出す。
-->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1017">
<title>Toopdbq — 時間と予算</title>
<link rel="stylesheet" href="../../DesignSystem/colors_and_type.css">
<link rel="stylesheet" href="../../DesignSystem/preview/card.css">
<link rel="stylesheet" href="ptb.css">
<style>
  .quiet{position:absolute;inset:0;background:radial-gradient(ellipse 70% 56% at 50% 50%, rgba(var(--V),.7), rgba(var(--V),.5) 50%, rgba(var(--V),.1) 100%)}
  .big{position:absolute;left:51px;top:460px;width:300px;height:300px;border-radius:50%;
    background:url(../../assets/images/bubble.webp) center/100% no-repeat, rgba(var(--V),.12)}
  .head{position:absolute;left:91px;top:590px;width:220px;text-align:center;font-size:18px;font-weight:700;line-height:1.4;transition:top .3s}
  .ans{position:absolute;width:88px;height:88px;cursor:pointer;text-align:center;font-size:11px;font-weight:700;line-height:1.25;align-content:center;gap:2px;
    opacity:0;transform:scale(.6);transition:opacity .3s,transform .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
  .ans b{font-size:18px;line-height:1}
  .ans.on{opacity:1;transform:none;pointer-events:auto}
  .hint{position:absolute;left:0;right:0;top:696px;text-align:center;font-size:12px;color:var(--fg2);transition:opacity .3s}
  .restart{position:absolute;left:24px;top:766px;height:44px;padding:0 6px;border:0;background:none;color:var(--fg2);font:700 13px/44px -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;cursor:pointer}
  #dlg{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:100;background:transparent;opacity:0;pointer-events:none;transition:opacity .2s}
  #dlg.on{opacity:1;pointer-events:auto}
</style></head>
<body>
<div class="phone" id="phone">
  <div class="city"></div><div class="quiet"></div>
  <div class="big"></div>
  <div class="head" id="head">時間と予算を<br>決めてね</div>
  <div class="ans bub" id="a-time" style="left:100px;top:592px"></div>
  <div class="ans bub" id="a-budget" style="left:214px;top:592px"></div>
  <div class="hint" id="hint"></div>
  <button class="restart" id="restart">最初から</button>
  <div class="corner c1 bub s52"><img class="ico" src="../../assets/icons/icon_search.png" alt=""></div>
  <div class="corner c2 bub s52"><svg width="18" height="22" viewBox="0 0 18 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 2h14v18l-7-5-7 5z"/></svg></div>
</div>
<iframe id="dlg" title="dialog"></iframe>
<script src="ptb.js"></script>
<script>
  const root = document.documentElement; root.classList.add('device');
  const fit = () => root.style.setProperty('--k', Math.min(innerWidth / 402, innerHeight / 874));
  fit(); addEventListener('resize', fit);
  document.addEventListener('gesturestart', e => e.preventDefault());
  const P = PTB.P, $ = id => document.getElementById(id), dlg = $('dlg');
  const extra = (P.get('theme') ? `&theme=${P.get('theme')}` : '');
  const FILES = { time: 'time-final.html', budget: `budget-a.html?data=${PTB.dataKey()}` };
  const val = {}; let cur = null;
  function open(kind, reopen) {
    cur = kind; dlg.classList.remove('on');
    const f = FILES[kind], q = (f.includes('?') ? '&' : '?') + 'embed' + extra + (reopen ? `&mode=reopen&v=${encodeURIComponent(JSON.stringify(val[kind].value))}` : '');
    dlg.onload = () => dlg.classList.add('on');
    dlg.src = f + q;
  }
  function close() { dlg.classList.remove('on'); cur = null; paint(); }
  function paint() {
    ['time', 'budget'].forEach(k => { const el = $('a-' + k); if (val[k]) { el.innerHTML = `<b>${val[k].emoji}</b>${val[k].answer}`; el.classList.add('on'); } else el.classList.remove('on'); });
    const both = val.time && val.budget;
    $('head').innerHTML = both ? 'この内容で<br>プランを作ります' : '時間と予算を<br>決めてね';
    $('head').style.top = (val.time || val.budget) ? '524px' : '586px';
    $('hint').textContent = both ? '泡を押すと決め直せます' : '';
  }
  addEventListener('message', e => {
    const d = e.data; if (!d || !d.ptb || !cur) return;
    if (d.type === 'done') {
      const first = !val[cur]; val[cur] = d; const was = cur; close();
      if (first && was === 'time' && !val.budget) setTimeout(() => open('budget', false), 700); // 実際はこの間に「好みの段」
    } else if (d.type === 'cancel') close();
  });
  $('a-time').onclick = () => open('time', true);
  $('a-budget').onclick = () => open('budget', true);
  $('restart').onclick = () => { delete val.time; delete val.budget; paint(); open('time', false); };
  paint(); setTimeout(() => open('time', false), 400);
</script>
</body></html>
