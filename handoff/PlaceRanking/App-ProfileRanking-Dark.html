<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toopdbq — Profile ランキング（v2 作成フロー · Dark）</title>
<link rel="stylesheet" href="../../DesignSystem/colors_and_type.css">
<link rel="stylesheet" href="../../DesignSystem/preview/card.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="PlaceRankingTab-v1.css">
<link rel="stylesheet" href="PlaceRanking.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Pacifico&display=swap">
<style>
  html, body { margin: 0; min-height: 100%; background: #15151a; }
  body { min-height: max(100vh, 970px); display: grid; place-items: center; padding: 40px 0; box-sizing: border-box; }
  .phone { background: #000; box-shadow: 0 0 0 2px #2a2a31, 0 0 0 12px #0a0a0e, 0 0 0 13px #303039, 0 36px 90px rgba(0,0,0,.72); }
  .scr { position: absolute; inset: 0; }
  [hidden] { display: none !important; }

  /* ---- A. プロフィール ---- */
  .pr-tab { cursor: pointer; }
  .pr-feed { overflow-y: auto; scrollbar-width: none; }
  .pr-feed::-webkit-scrollbar { display: none; }
  .pr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px 0; }
  .pr-grid img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; background: var(--band); }
  .rk-head { padding-bottom: 10px; }
  .rk-hero { margin: 0; border-radius: 0; height: auto; aspect-ratio: 16 / 9; cursor: pointer; }
  .rk-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-top: 2px; }
  .rk-pair .rk-hero { aspect-ratio: 1 / 1; }
  .rk-pair .rk-hero .cap { left: 12px; right: 12px; gap: 8px; }
  .rk-pair .rk-hero .cap .no { font-size: 24px; }
  .rk-pair .rk-hero .cap .nm { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rk-pair .rk-hero .cap .ad { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rk-hero .cap .c { min-width: 0; }
  .rk-hero::after { background: linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,0) 55%); }
  .rk-hero .cap { top: 14px; bottom: auto; align-items: flex-start; }
  .rk-hero.none-ph { display: grid; place-items: center; }
  .rk-hero.none-ph > img.i { width: 32px; height: 32px; object-fit: contain; position: relative; z-index: 1; }
  .rk-gm { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-sub); }
  .rk-gm .g { flex: none; white-space: nowrap; font-weight: 700; color: #fff; background: var(--gc, #08080b); border-radius: 9999px; padding: 2px 8px; font-size: 10px; }
  .rk.new { animation: rk-enter 320ms cubic-bezier(0,0,.2,1) both; }
  @keyframes rk-enter { from { opacity: 0; transform: translateY(-12px); } }


  /* 一覧 = 確認モードのスナップ（1 位を上中央に大きく、2・3 位を下に） */
  .rk { padding: 0; border-bottom: 8px solid var(--band); cursor: pointer; }
  .rk-stage { position: relative; overflow: hidden; background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 1px, transparent 1px 58px), repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 1px, transparent 1px 58px), #e9e5d9; }
  .rk-stage .pk-tout { left: 28px; right: auto; top: 28px; max-width: 80%; text-align: left; transform: rotate(-3deg); transform-origin: 0 0; z-index: 25; }
  .rk-stage .pk-tout .l1 { font-size: 22px; -webkit-text-stroke-width: 5px; line-height: 1.2; }
  .rk-stage .pk-tout .l2 { font-size: 24px; -webkit-text-stroke-width: 5px; }
  .rk-stage .pk-stack { transition: none; }
  .pk-screen.nomap .pk-map { visibility: hidden; }
  .pk-screen.nomap { background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 58px), repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 58px), #0b0b0f; }
  .pk-screen.nomap .pk-pt, .pk-screen.nomap .pk-leader { display: none; }
  .rk-stage .pk-lab { max-width: 104%; }
  .pr-fab, .pr-fab.ink { width: 55px; height: 55px; background: none; box-shadow: none; }
  .pr-fab img { width: 28px; height: 28px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  .pr-fab:active { transform: scale(.94); }
  /* ---- B. v2 作成フロー ---- */
  .pk-flow { transform: translateY(100%); transition: transform 360ms cubic-bezier(0,0,.2,1); z-index: 20; }
  .pk-flow.in { transform: none; }
  .pk-flow.out { transform: none; opacity: 0; transition: opacity 240ms cubic-bezier(.4,0,.2,1); }
  .pk-mk, .pk-chip, .pk-row, .pk-slot, .sh-bg, .pk-ttl .band, .pk-search { cursor: pointer; }
  .pk-sheet { height: var(--sh, 393px); transition: height 260ms cubic-bezier(.4,0,.2,1), transform 320ms cubic-bezier(.4,0,.2,1); }
  .pk-sheet.down { transform: translateY(100%); }
  .pk-body { position: absolute; left: 0; right: 0; top: 16px; bottom: 0; overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain; }
  .pk-body::-webkit-scrollbar { display: none; }
  .pk-grab { position: absolute; left: 0; right: 0; top: 0; height: 16px; z-index: 2; cursor: grab; }
  .pk-sec.in { animation: pk-sec 240ms cubic-bezier(0,0,.2,1) both; }
  .pk-cols { padding: 14px 12px 2px; margin: 0 -12px; }
  /* タイトル + 作成を写真の下に横並び */
  .pk-tbar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .pk-tbar .pk-ttl { flex: 1; min-width: 0; min-height: 0; }
  .pk-tbar .pk-cta { flex: none; width: auto; margin-top: 0; padding: 0 24px; }
  .pk-ttl .band { height: auto; min-height: 32px; white-space: normal; max-width: none; line-height: 1.35; padding-bottom: 3px; align-items: center; }
  .pk-ttl .band span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 詳細が開いているときは写真をシートの上端まで */
  .pk-sheet.detail .pk-body { top: 0; }
  .pk-sheet.detail > span.grab { position: absolute; left: 50%; top: 6px; margin: 0 0 0 -18px; background: rgba(255,255,255,.75); z-index: 3; }
  /* 確認モード = 写真を全部見せる（枚数で組みが変わる）+ 中央に順位 + 名前 */
  .pk-stack .ph.fp { inset: auto; }
  .pk-stack .pk-lab { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%) rotate(-4deg); gap: 6px; max-width: 94%; z-index: 4; }
  .pk-stack .pk-lab .r { height: var(--rh, 24px); min-width: var(--rh, 24px); font-size: var(--rf, 12px); line-height: var(--rh, 24px); box-shadow: 0 0 0 1.5px var(--ink), 0 2px 6px rgba(0,0,0,.25); }
  .pk-stack .pk-lab .nm { height: var(--nh, 26px); line-height: var(--nh, 26px); font-size: var(--nf, 15px); max-width: none; }
  .pk-stack .pk-lab .nm .o { font-family: var(--font-latin); font-style: normal; font-weight: 900; font-size: var(--rf, 12px); margin-right: 7px; }
  /* 詳細 = 名前 / 幅いっぱいの写真（右上にチェック）/ 思い出の写真 3 枚 / 住所 / ジャンル・評価・営業 */
  .pk-cover { position: relative; margin: 0 -16px; aspect-ratio: 4 / 3; background: var(--dark-ph); overflow: hidden; }
  .pk-cover img.c { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .pk-cover .none { position: absolute; inset: 0; display: grid; place-items: center; }
  .pk-cover .none img { width: 28px; height: 28px; opacity: .55; }
  .pk-cover::before, .pk-cover::after { content: ''; position: absolute; left: 0; right: 0; pointer-events: none; }
  .pk-cover::before { top: 0; height: 40%; background: linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,0)); }
  .pk-cover::after { bottom: 0; height: 58%; background: linear-gradient(0deg, rgba(0,0,0,.72), rgba(0,0,0,0)); }
  .co-nm { position: absolute; left: 16px; top: 14px; right: 120px; z-index: 2; color: #fff; font-weight: 700; font-size: 18px; line-height: 1.3;
    text-shadow: 0 2px 6px rgba(0,0,0,.6); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .co-g { position: absolute; right: 12px; top: 12px; z-index: 2; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--gc, var(--ink));
    color: #fff; font-weight: 700; font-size: 11px; line-height: 26px; white-space: nowrap; box-shadow: 0 2px 8px rgba(8,8,11,.3); }
  .co-meta { position: absolute; left: 16px; bottom: 14px; right: 150px; z-index: 2; display: flex; flex-direction: column; gap: 3px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .co-meta .ad { font-size: 12px; line-height: 1.4; }
  .co-meta .num { font-family: var(--font-latin); font-weight: 600; font-size: 13px; }
  .co-meta .op { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
  .co-meta .op::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--open); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .co-meta .op span { font-weight: 400; opacity: .82; }
  .co-add { position: absolute; right: 12px; bottom: 12px; z-index: 2; height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(255,255,255,.95);
    box-shadow: 0 2px 8px rgba(8,8,11,.3); display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12px; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .co-add img { width: 16px; height: 16px; filter: invert(1); }
  .co-add:active { transform: scale(.97); }
  /* 場所の投稿を横にめくる（ストーリーズのミシン目） */
  .co-bars { position: absolute; left: 12px; right: 12px; top: 8px; z-index: 4; display: flex; gap: 4px; }
  .co-bars i { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,.34); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .co-bars i.on { background: #fff; }
  .pk-cover.bars .co-nm { top: 22px; }
  .pk-cover.bars .co-g { top: 20px; }
  .co-tap { position: absolute; top: 0; bottom: 0; z-index: 1; cursor: pointer; }
  .co-tap.p { left: 0; width: 38%; }
  .co-tap.n { right: 0; width: 62%; }
  .co-nm .o { font-family: var(--font-latin); font-style: italic; font-weight: 900; font-size: 15px; margin-right: 8px; opacity: .95; }
  .pk-mem.ro .pk-slot { cursor: default; }
  .co-meta .tx { font-size: 13px; line-height: 1.5; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pk-mem { gap: 10px; }
  .pk-mem .pk-slot { width: auto; flex: 1 1 0; aspect-ratio: 1 / 1; height: auto; }
  .pk-dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .pk-dmeta .sep { color: rgba(8,8,11,.28); }
  .pk-dmeta .num { font-family: var(--font-latin); font-weight: 600; }
  .pk-dmeta .op { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .pk-dmeta .op::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--open); }
  .pk-dmeta .op span { color: var(--ink-sub); font-weight: 400; }
  /* 候補リスト = 2 列グリッド（写真が列幅いっぱい・名前 2 行 / 住所 1 行・チェックは右上角） */
  .pk-g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; padding: 4px 0 2px; align-items: start; }
  .pk-cell { position: relative; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
  .pk-cell .pic { position: relative; width: 100%; aspect-ratio: 4 / 3; flex: none; }
  .pk-cell .pic > img, .pk-cell .pic .none { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(8,8,11,.22); display: block; background: var(--dark-ph); box-sizing: border-box; }
  .pk-cell .pic .none { display: grid; place-items: center; }
  .pk-cell .pic .none img { position: static; width: 22px; height: 22px; border: 0; box-shadow: none; opacity: .5; }
  .pk-cell .pic .r { position: absolute; left: -6px; top: -8px; height: 22px; padding: 0 6px; border-radius: 9999px; background: #fff; box-shadow: 0 0 0 1.5px var(--ink); color: var(--ink); font-family: var(--font-latin); font-weight: 800; font-size: 11px; line-height: 22px; display: flex; align-items: baseline; transform: rotate(-8deg); z-index: 2; }
  .pk-cell .ck { position: absolute; right: -10px; top: -10px; width: 44px; height: 44px; display: grid; place-items: center; z-index: 3; }
  .pk-cell .ck i { width: 24px; height: 24px; border-radius: 8px; background: rgba(255,255,255,.95); box-shadow: inset 0 0 0 1.5px rgba(8,8,11,.30), 0 1px 4px rgba(8,8,11,.25); display: grid; place-items: center; }
  .pk-cell .ck img { width: 13px; height: 13px; display: none; position: static; border: 0; box-shadow: none; border-radius: 0; }
  .pk-cell.on .ck i { background: var(--ink); box-shadow: 0 1px 4px rgba(8,8,11,.25); }
  .pk-cell.on .ck img { display: block; }
  .pk-cell .nm { font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pk-cell .ad { font-size: 11px; line-height: 1.4; color: var(--ink-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }
  @keyframes pk-sec { from { opacity: 0; transform: translateY(12px); } }
  .pk-slot img.p, .pk-stack .ph img { animation: pk-fade 200ms linear both; }
  @keyframes pk-fade { from { opacity: 0; } }
  .pk-stack { transition: opacity 260ms cubic-bezier(0,0,.2,1), transform 260ms cubic-bezier(0,0,.2,1); }
  .pk-stack.enter { opacity: 0; transform: scale(.9); }
  .pk-ttl .band input { width: 11ch; min-width: 4ch; border: 0; background: none; outline: none; font: inherit; color: inherit; padding: 0; }
  .pk-hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--sh, 393px) + 12px); z-index: 11;
    height: 32px; padding: 0 12px; border-radius: 9999px; background: var(--white-face); box-shadow: 0 2px 8px rgba(8,8,11,.18);
    font-size: 12px; font-weight: 700; color: var(--ink); display: flex; align-items: center; white-space: nowrap; pointer-events: none;
    transition: opacity 200ms linear, bottom 260ms cubic-bezier(.4,0,.2,1); }

  /* ---- C. 共有 ---- */
  .sh-scrim { position: absolute; inset: 0; background: rgba(8,8,11,.78); z-index: 14; animation: pk-fade 200ms linear both; }
  .sh-hd { position: absolute; left: 0; right: 0; top: var(--safe-top); height: 56px; z-index: 16; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; }
  .sh-hd .x { position: absolute; left: 8px; top: 6px; width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
  .sh-hd .x img { width: 16px; height: 16px; }
  .sh-story { position: absolute; left: 50%; top: calc(var(--safe-top) + 64px); width: 270px; height: 480px; margin-left: -135px; border-radius: 14px; overflow: hidden; z-index: 16; background: #e9e5d9; box-shadow: 0 12px 40px rgba(0,0,0,.5); font-family: var(--font-jp); color: var(--ink); }
  .sh-story .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .sh-story .map { position: absolute; inset: 0; }
  .sh-story .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 30%, transparent 70%, rgba(0,0,0,.45)); }
  .sh-story .pk-tout { top: 66px; left: 14px; right: 14px; }
  .sh-story .pk-tout .l1 { font-size: 17px; -webkit-text-stroke-width: 4.5px; }
  .sh-story .pk-tout .l2 { font-size: 21px; -webkit-text-stroke-width: 4.5px; }
  .sh-story .pk-stack .rs { height: 22px; font-size: 11px; padding: 0 6px; line-height: 22px; left: -9px; top: -9px; }
  .sh-story .pk-lab { bottom: -11px; max-width: 150px; }
  .sh-story .pk-lab .nm { height: 21px; line-height: 21px; font-size: 11.5px; padding: 0 9px; max-width: 150px; }
  .sh-sign { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%) rotate(-2deg); height: 26px; padding: 0 10px; border-radius: 9999px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); display: flex; align-items: center; gap: 7px; white-space: nowrap; z-index: 8; }
  .sh-sign .w { font-family: 'Pacifico', cursive; font-size: 12px; color: var(--ink); line-height: 1; }
  .sh-sign .u { font-family: var(--font-latin); font-weight: 700; font-size: 10px; color: var(--ink-sub); }
  .sh-bgs { position: absolute; left: 16px; right: 16px; top: calc(var(--safe-top) + 566px); z-index: 16; }
  .sh-bgs .eb { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.6); letter-spacing: .04em; height: 20px; }
  .sh-bgs .row { display: flex; gap: 10px; margin-top: 4px; }
  .sh-bg { position: relative; width: 60px; height: 60px; flex: none; border-radius: 10px; overflow: hidden; background: #e9e5d9; box-shadow: 0 0 0 1.5px rgba(255,255,255,.25); }
  .sh-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sh-bg.on { box-shadow: 0 0 0 2.5px #fff; }
  .sh-bg.on::after { content: ''; position: absolute; right: 4px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink) url('../../assets/icons/icon_check.png') center / 9px no-repeat; box-shadow: 0 0 0 1.5px #fff; }
  .sh-bg .l { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: rgba(8,8,11,.7); color: #fff; font-size: 9px; font-weight: 700; line-height: 18px; text-align: center; }
  .sh-bg.map { background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 1px, transparent 1px 12px), repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 1px, transparent 1px 12px), #e9e5d9; }
  .sh-bg.lib { background: rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #fff; font-size: 9px; font-weight: 700; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3); }
  .sh-bg.lib img { width: 18px; height: 18px; }
  .sh-cta { position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-bot) + 12px); z-index: 16; height: 56px; border: 0; border-radius: 9999px; background: #fff; color: var(--ink); font-family: var(--font-jp); font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
  .sh-cta img { width: 18px; height: 18px; filter: invert(1); }
  .sh-cta:active { transform: scale(.97); }
  .pk-save.share { white-space: nowrap; min-width: 260px; padding: 0 28px; }
  .pk-save.share img { width: 18px; height: 18px; filter: invert(1); }
  .pk-done { position: absolute; left: 50%; bottom: calc(var(--safe-bot) + 76px); transform: translateX(-50%); z-index: 9; height: 32px; padding: 0 12px; border-radius: 9999px; background: #fff; box-shadow: 0 2px 8px rgba(8,8,11,.15); font-size: 12px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; white-space: nowrap; animation: pk-fade 200ms linear both; }
  .pk-done img { width: 12px; height: 12px; filter: invert(1); }
  .sh-toast { position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-bot) + 16px); height: 48px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(8,8,11,.2); display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 13px; font-weight: 700; color: var(--ink); z-index: 18; animation: pk-fade 200ms linear both; }
  .sh-toast img { width: 16px; height: 16px; filter: invert(1); }
  .pk-spin.big { width: 20px; height: 20px; border-width: 2.5px; animation: pk-spin 800ms linear infinite; }
  @keyframes pk-spin { to { transform: rotate(360deg); } }
  .pk-screen .maplibregl-ctrl-bottom-left, .pk-screen .maplibregl-ctrl-bottom-right, .sh-story .maplibregl-ctrl-bottom-left, .sh-story .maplibregl-ctrl-bottom-right { display: none; }

  /* ================= DARK MODE + 仕上げ（一流の細部）================= */
  :root { --d-bg: #000; --d-sheet: #0e0e12; --d-raise: #16161b; --d-fg: #fff; --d-fg2: rgba(255,255,255,.58); --d-fg3: rgba(255,255,255,.36); --d-line: rgba(255,255,255,.10); --d-band: rgba(255,255,255,.06); }
  .statusbar { color: #fff; }
  .home-ind { background: rgba(255,255,255,.9); }
  /* --- A. プロフィール --- */
  .pr-screen { background: var(--d-bg); color: var(--d-fg); }
  .pr-ubar .nm, .pr-ubar .st b { color: var(--d-fg); }
  .pr-ubar .sb, .pr-ubar .st { color: var(--d-fg2); }
  .pr-ubar .ib img { filter: none; opacity: .85; }

  /* 閲覧シート: 触れて上へスクロールしたらフルスクリーン近くまで広げる */
  $('body').addEventListener('wheel', function (e) {
    if (S.view !== 'saved') return;
    if (S.sh < 800 && e.deltaY > 0) setSheet(800);
    else if (S.sh >= 800 && e.deltaY < 0 && $('body').scrollTop <= 0) setSheet(170);
  }, { passive: true });
  (function () { var y0 = null; var b = $('body');
    b.addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; }, { passive: true });
    b.addEventListener('touchmove', function (e) {
      if (y0 == null || S.view !== 'saved') return;
      var dy = y0 - e.touches[0].clientY;
      if (S.sh < 800 && dy > 8) setSheet(800);
      else if (S.sh >= 800 && dy < -8 && b.scrollTop <= 0) setSheet(170);
    }, { passive: true });
  })();

  /* 列の並べ替え（ドラッグ） */
  function bindDrag() {
    var cols = $('cols'); if (!cols) return;
    cols.querySelectorAll('.pk-colm[data-col]').forEach(function (el) {
      el.addEventListener('pointerdown', function (ev) {
        if (ev.target.closest('[data-rm]')) return;
        var i = +el.dataset.col, x0 = ev.clientX, moved = false;
        el._moved = false; el.setPointerCapture(ev.pointerId);
        function mv(e) {
          var dx = e.clientX - x0;
          if (Math.abs(dx) > 6) { moved = true; el._moved = true; el.classList.add('drag'); }
          if (moved) el.style.transform = 'translate(' + dx + 'px,-4px) scale(1.08)';
        }
        function up(e) {
          el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up);
          el.classList.remove('drag'); el.style.transform = '';
          if (!moved) { setTimeout(function () { el._moved = false; }, 0); return; }
          var j = Math.max(0, Math.min(S.picked.length - 1, i + Math.round((e.clientX - x0) / 86)));
          if (j !== i) { var p = S.picked.splice(i, 1)[0]; S.picked.splice(j, 0, p); }
          renderSheet(true); paint();
        }
        el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
      });
    });
  }

  /* ---------- モーダル: タイトル編集 / 写真を追加 ---------- */
  function closeModals() { $('modals').innerHTML = ''; }
  function openTitleDlg() {
    $('modals').innerHTML = '<div class="pk-dim" data-dismiss></div><div class="pk-dlg">' +
      '<div class="in"><input id="tin" type="text" maxlength="14" style="width:100%;border:0;outline:none;background:none;font:inherit;text-align:center;color:inherit"></div>' +
      '<div class="l">ランキング</div><button class="ok" type="button" id="tok">決定</button></div>';
    var inp = $('tin'); inp.value = S.title; setTimeout(function () { inp.focus(); }, 60);
    $('tok').addEventListener('click', function () { S.title = inp.value.trim(); closeModals(); renderSheet(true); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('tok').click(); });
  }
  function openPhotoSheet(p, slot) {
    if (!p) return;
    S.photoFor = { p: p, slot: slot };
    $('modals').innerHTML = '<div class="pk-dim" data-dismiss></div><div class="pk-asheet">' +
      '<div class="hd">' + esc(p.nm) + ' に写真を追加</div>' +
      '<div class="it" data-pick="1"><img src="' + IC + 'icon_camera.png" alt="">カメラで撮る</div>' +
      '<div class="it" data-pick="1"><img src="' + IC + 'icon_image.png" alt="">ライブラリから選ぶ</div>' +
      '<div class="it cancel" data-dismiss>キャンセル</div></div>';
  }
  var POOL = ['reel003.jpg', 'reel007.jpg', 'reel011.jpg', 'reel022.jpg', 'reel026.jpg', 'reel033.jpg', 'reel039.jpg', 'reel046.jpg'], pool = 0;
  $('modals').addEventListener('click', function (e) {
    if (e.target.closest('[data-dismiss]')) { closeModals(); return; }
    if (e.target.closest('[data-pick]')) {
      var f = S.photoFor, src = RL + POOL[pool++ % POOL.length];
      if (f) {
        if (f.slot != null && f.p.my[f.slot]) f.p.my[f.slot] = src; else f.p.my = f.p.my.concat([src]).slice(0, 3);
        f.p.media = [f.p.ph].concat(f.p.my).filter(Boolean).slice(0, 4);
      }
      closeModals(); renderSheet(true);
    }
  });

  /* ---------- C. 確認モード ---------- */
  var SAFE = { x0: 8, x1: 394, y0: 200, y1: 760 }, SIZES = [[352, 198], [280, 158], [216, 122]];
  var LAB_DROP = 14, GAP = 16, LEADER = 24, WEIGHT = [10, 3, 1];
  var PERMS = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  function placeRows(pts) {
    var n = pts.length;
    if (n === 1) return [{ x: clampX(pts[0].x, SIZES[0][0]), y: Math.max(SAFE.y0 + SIZES[0][1] / 2, Math.min(SAFE.y1 - SIZES[0][1] / 2, pts[0].y)), w: SIZES[0][0], h: SIZES[0][1] }];
    var perms = n === 2 ? [[0, 1], [1, 0]] : PERMS, best = null;
    perms.forEach(function (order) {
      var y = [], rows = order.map(function (i) { return { i: i, h: SIZES[i][1] + LAB_DROP, w: SIZES[i][0], t: pts[i].y - SIZES[i][1] / 2 }; }), k;
      for (k = 0; k < n; k++) y[k] = Math.max(rows[k].t, k ? y[k - 1] + rows[k - 1].h + GAP : SAFE.y0);
      for (k = n - 1; k >= 0; k--) y[k] = Math.min(y[k], (k < n - 1 ? y[k + 1] - GAP : SAFE.y1) - rows[k].h);
      for (k = 0; k < n; k++) y[k] = Math.max(y[k], k ? y[k - 1] + rows[k - 1].h + GAP : SAFE.y0);
      var cost = 0, out = [];
      rows.forEach(function (r, k2) {
        var cy = y[k2] + SIZES[r.i][1] / 2;
        cost += WEIGHT[r.i] * Math.abs(cy - pts[r.i].y);
        out[r.i] = { x: clampX(pts[r.i].x, r.w), y: cy, w: SIZES[r.i][0], h: SIZES[r.i][1] };
      });
      if (!best || cost < best.cost) best = { cost: cost, out: out };
    });
    return best.out;
  }
  function clampX(x, w) { return Math.max(SAFE.x0 + w / 2, Math.min(SAFE.x1 - w / 2, x)); }

  /* 枚数ごとの組み: 1 = 1 枚 / 2 = 正方形を横に / 3 = ピラミッド / 4 = グリッド */
  function frames(n, w, h) {
    var g = -16, s, x0, y0, tw, th, bw, bh, cw, ch;
    if (n <= 1) return [[0, 0, w, h, 0]];
    if (n === 2) {
      s = Math.min(h, (w - g) / 2); x0 = (w - s * 2 - g) / 2; y0 = (h - s) / 2;
      return [[x0, y0, s, s, -3], [x0 + s + g, y0, s, s, 3]];
    }
    if (n === 3) {
      tw = w * 0.62; th = h * 0.66; bw = w * 0.46; bh = h * 0.46;
      return [[(w - tw) / 2, 0, tw, th, -2], [w / 2 - bw + 8, h - bh, bw, bh, -4], [w / 2 - 8, h - bh, bw, bh, 4]];
    }
    cw = (w - g) / 2; ch = (h - g) / 2;
    return [[0, 0, cw, ch, -2], [w - cw, 0, cw, ch, 2], [0, h - ch, cw, ch, 2], [w - cw, h - ch, cw, ch, -2]];
  }
  function groupHtml(p, i, w, h, k) {
    var m = mediaOf(p).slice(0, 4), out = '';
    if (!m.length) out = '<div class="ph none"><img src="' + IC + 'icon_pin_location.png" alt=""></div>';
    else {
      var fs = frames(m.length, w, h);
      out = m.map(function (src, j) {
        var f = fs[j];
        return '<div class="ph fp" style="left:' + f[0].toFixed(1) + 'px; top:' + f[1].toFixed(1) + 'px; width:' + f[2].toFixed(1) + 'px; height:' + f[3].toFixed(1) + 'px; transform: rotate(' + f[4] + 'deg)"><img src="' + src + '" alt=""></div>';
      }).join('');
    }
    var sz = [[28, 15, 30, 17], [24, 13, 26, 15], [22, 11.5, 23, 13]][Math.min(i, 2)].map(function (v) { return v * k; });
    return out + '<div class="pk-lab" style="--nh:' + sz[2] + 'px; --nf:' + sz[3] + 'px; --rf:' + sz[1] + 'px">' +
      '<span class="nm' + (isLat(p.nm) ? ' lat' : '') + '"><b class="o">' + ORD[i] + '</b>' + esc(p.nm) + '</span></div>';
  }
  function stackHtml(p, i, box) {
    return '<div class="pk-stack wide enter" style="--x:' + box.x + 'px; --y:' + box.y + 'px; --w:' + box.w + 'px; --h:' + box.h + 'px">' +
      groupHtml(p, i, box.w, box.h, 1) + '</div>';
  }
  function paintConfirm(animate) {
    if (!map || S.mode !== 'confirm') return;
    var top = S.picked.slice(0, 3), rest = S.picked.slice(3);
    var pts = top.map(function (p) { return xy(p.c); });
    var boxes = placeRows(pts);
    var html = pts.map(function (q) { return '<div class="pk-pt" style="--x:' + q.x + 'px; --y:' + q.y + 'px"></div>'; }).join('');
    var lines = '';
    boxes.forEach(function (b, i) {
      var q = pts[i];
      if (Math.abs(b.y - q.y) > b.h / 2 + LEADER || Math.abs(b.x - q.x) > b.w / 2 + LEADER) {
        var tx = Math.max(b.x - b.w / 2 + 12, Math.min(b.x + b.w / 2 - 12, q.x));
        var ty = q.y < b.y ? b.y - b.h / 2 + 14 : b.y + b.h / 2 - 14;
        lines += '<path d="M' + q.x + ' ' + q.y + ' L' + tx + ' ' + ty + '" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6" fill="none"/>';
      }
    });
    html += '<svg class="pk-leader" aria-hidden="true">' + lines + '</svg>';
    html += top.map(function (p, i) { return stackHtml(p, i, boxes[i]); }).join('');
    html += rest.map(function (p, i) {
      var q = xy(p.c);
      return '<div class="pk-ppin" style="--x:' + q.x + 'px; --y:' + q.y + 'px"><img src="' + (p.ph || '') + '" alt=""><span class="r">' + ORD[i + 3] + '</span></div>';
    }).join('');
    $('ovl').innerHTML = html;
    var st = $('ovl').querySelectorAll('.pk-stack');
    if (animate) st.forEach(function (el, i) { setTimeout(function () { el.classList.remove('enter'); }, 60 * i); });
    else st.forEach(function (el) { el.classList.remove('enter'); });
  }
  function confirmCamera(list) {
    var lng = 0, lat = 0, n = list.length;
    list.forEach(function (p) { lng += p.c[0]; lat += p.c[1]; });
    var C = [lng / n, lat / n], R = 0;
    list.forEach(function (p) {
      var dx = (p.c[0] - C[0]) * 111320 * Math.cos(C[1] * Math.PI / 180), dy = (p.c[1] - C[1]) * 111320;
      R = Math.max(R, Math.hypot(dx, dy));
    });
    R = Math.max(120, R) * 1.8;
    return { center: C, zoom: zoomFor(C[1], R * 2, $('map').clientWidth || 402, 0.72) };
  }
  function renderSavedSheet(keepScroll) {
    var b = $('body'), top = keepScroll ? b.scrollTop : 0;
    b.innerHTML = S.picked.map(function (p, i) { return detailHtml(p, S.pages[p.id] || 0, p.id, true, i); }).join('');
    b.scrollTop = top;
    $('sheet').classList.add('detail'); $('sheet').classList.remove('down');
  }
  function setConfirmChrome() {
    var g = genre(S.g);
    $('tout').hidden = false;
    $('toutT').textContent = S.title || g.lb;
    $('toutN').textContent = 'BEST ' + S.picked.length;
    $('chips').hidden = true; $('search').hidden = true; $('hint').style.opacity = 0;
    if (S.view === 'saved') { setSheet(170); renderSavedSheet(); $('save').hidden = true; }
    else { $('sheet').classList.add('down'); $('save').hidden = false; renderSaveBtn(); }
  }
  function renderSaveBtn() {
    var b = $('save');
    b.className = 'pk-cta pk-save' + (S.saved ? ' share' : '');
    b.innerHTML = S.saving ? '<span class="pk-spin big"></span>' : (S.saved ? '<img src="' + IC + 'icon_share.png" alt="">ストーリーズに共有' : '保存');
  }
  function enterConfirm() {
    if (!S.picked.length) return;
    S.mode = 'confirm'; S.view = 'create'; S.sel = null; S.saved = false; S.saving = false;
    Object.keys(markers).forEach(function (k) { markers[k].remove(); delete markers[k]; });
    $('ovl').innerHTML = '';
    setConfirmChrome();
    var cam = confirmCamera(S.picked.slice(0, 3));
    map.easeTo({ center: cam.center, zoom: cam.zoom, duration: 480 });
    map.once('moveend', function () { paintConfirm(true); });
    setTimeout(function () { if (!$('ovl').children.length) paintConfirm(true); }, 560);
  }
  function exitConfirm() {
    S.mode = 'create'; S.view = 'create'; $('screen').classList.remove('nomap'); $('tout').hidden = true; $('save').hidden = true; $('done').hidden = true;
    $('chips').hidden = false; $('search').hidden = false;
    $('ovl').innerHTML = ''; $('sheet').classList.remove('down');
    renderSheet(); paint();
  }
  $('save').addEventListener('click', function () {
    if (S.saved) { openShare(); return; }
    S.saving = true; renderSaveBtn();
    setTimeout(function () {
      S.saving = false; S.saved = true; renderSaveBtn();
      $('done').hidden = false; setTimeout(function () { $('done').hidden = true; }, 2000);
      RANKINGS.unshift({ title: S.title || genre(S.g).lb, g: S.g, date: 'たった今', fresh: true, ids: S.picked.map(function (p) { return p.id; }) });
      renderFeed();
    }, 900);
  });
  $('back').addEventListener('click', function () {
    if (S.mode === 'confirm' && !S.saved) { exitConfirm(); return; }
    closeFlow();
  });

  /* ---------- 共有 ---------- */
  var shareMap = null, shareBg = 'map';
  function shareStacks(list) {
    var W = [176, 148, 124], y = 116;
    return list.slice(0, 3).map(function (p, i) {
      var w = W[i], h = Math.round(w * 9 / 16);
      var cy = y + h / 2; y += h + 12;
      return '<div class="pk-stack wide" style="--x:135px; --y:' + cy + 'px; --w:' + w + 'px; --h:' + h + 'px">' +
        groupHtml(p, i, w, h, 0.72) + '</div>';
    }).join('');
  }
  function renderShare() {
    var list = S.picked, g = genre(S.g);
    var bgHtml = shareBg === 'map' ? '<div class="map" id="shMap"></div>'
      : '<img class="bg" src="' + shareBg + '" alt=""><div class="veil"></div>';
    $('modals').innerHTML = '<div class="sh-scrim" data-share-dismiss></div>' +
      '<div class="sh-hd">ストーリーズに共有<button class="x" type="button" data-share-dismiss aria-label="閉じる"><img src="' + IC + 'icon_close.png" alt=""></button></div>' +
      '<div class="sh-story">' + bgHtml +
      '<div class="pk-tout"><div class="l1">' + esc(S.title || g.lb) + '</div><div class="l2">BEST ' + list.length + '</div></div>' +
      shareStacks(list) +
      '<div class="sh-sign"><span class="w">Toopdbq</span><span class="u">@yuto</span></div></div>' +
      '<div class="sh-bgs"><div class="eb">背景</div><div class="row">' +
      '<div class="sh-bg map' + (shareBg === 'map' ? ' on' : '') + '" data-bg="map"><span class="l">地図</span></div>' +
      list.slice(0, 3).map(function (p) {
        return '<div class="sh-bg' + (shareBg === p.ph ? ' on' : '') + '" data-bg="' + p.ph + '"><img src="' + p.ph + '" alt=""></div>';
      }).join('') +
      '<div class="sh-bg lib" data-bg="lib"><img src="' + IC + 'icon_image.png" alt="">ライブラリ</div>' +
      '</div></div>' +
      '<button class="sh-cta" type="button" id="igo"><img src="' + IC + 'icon_share.png" alt="">Instagram で開く</button>';
    if (shareBg === 'map') {
      var cam = confirmCamera(list.slice(0, 3));
      shareMap = new maplibregl.Map({ container: $('shMap'), style: LIBERTY, center: cam.center,
        zoom: zoomFor(cam.center[1], 240, 270, 0.72), pitch: 0, bearing: 0, interactive: false,
        attributionControl: false, fadeDuration: 0 });
      shareMap.on('style.load', function () { patchLabels(shareMap); });
    }
  }
  function openShare() { shareBg = 'map'; renderShare(); }
  $('modals').addEventListener('click', function (e) {
    var t;
    if (e.target.closest('[data-share-dismiss]')) { shareMap = null; closeModals(); return; }
    if ((t = e.target.closest('[data-bg]'))) {
      var v = t.dataset.bg;
      shareBg = v === 'lib' ? RL + POOL[pool++ % POOL.length] : v;
      renderShare(); return;
    }
    if (e.target.closest('#igo')) {
      shareMap = null; closeModals();
      var tt = document.createElement('div');
      tt.className = 'sh-toast'; tt.innerHTML = '<img src="' + IC + 'icon_check.png" alt="">Instagram に渡しました<span class="a" style="margin-left:auto;text-decoration:underline">もう一度</span>';
      $('screen').appendChild(tt);
      tt.querySelector('.a').addEventListener('click', function () { tt.remove(); openShare(); });
      setTimeout(function () { tt.remove(); }, 3000);
    }
  });

  /* ---------- フローの開閉 ---------- */
  function openFlow() {
    var f = $('flow'); f.hidden = false; f.classList.remove('out');
    S.mode = 'create'; S.view = 'create'; $('screen').classList.remove('nomap'); S.picked = []; S.sel = null; S.title = ''; S.saved = false; S.fixed = false;
    $('tout').hidden = true; $('save').hidden = true; $('done').hidden = true;
    $('chips').hidden = false; $('search').hidden = false; $('sheet').classList.remove('down');
    ensureMap(); renderChips(); renderSheet(); closeModals();
    requestAnimationFrame(function () { f.classList.add('in'); map.resize(); });
    setTimeout(function () { map.resize(); fitGenre(0); paint(); }, 400);
  }
  function openSaved(i) {
    var r = RANKINGS[i];
    S.g = r.g; S.title = r.title; S.picked = items(r); S.sel = null;
    var f = $('flow'); f.hidden = false; f.classList.remove('out');
    ensureMap(); renderChips(); closeModals();
    S.mode = 'confirm'; S.view = 'saved'; S.pages = {}; S.saved = true; S.saving = false; $('screen').classList.add('nomap');
    Object.keys(markers).forEach(function (k) { markers[k].remove(); delete markers[k]; });
    $('ovl').innerHTML = ''; setConfirmChrome();
    requestAnimationFrame(function () { f.classList.add('in'); map.resize(); });
    var cam = confirmCamera(S.picked.slice(0, 3));
    setTimeout(function () {
      map.resize(); map.jumpTo({ center: cam.center, zoom: cam.zoom });
      paintConfirm(true);
    }, 380);
  }
  function closeFlow() {
    var f = $('flow');
    f.classList.add('out');
    setTimeout(function () {
      f.hidden = true; f.classList.remove('in', 'out'); closeModals();
      S.mode = 'create'; $('sheet').classList.remove('down');
      setTab('ranking'); $('rankFeed').scrollTop = 0;
    }, 260);
  }
  $('fab').addEventListener('click', openFlow);
})();
</script>
