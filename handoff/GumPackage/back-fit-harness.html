<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@import url('../../DesignSystem/colors_and_type.css');
html,body{margin:0;background:#111;color:#eee;font-family:var(--font-latin);font-size:12px;}
#stage{position:absolute;left:-4000px;top:0;}
.box{font-family:var(--font-jp);color:#fff;text-align:center;}
.box.en{font-family:var(--font-latin);}
pre{padding:12px;line-height:1.5;}
</style></head><body>
<div id="stage"></div><pre id="out">measuring…</pre>
<script>
/* v4.1 裏面: 見出し + 本文2段落だけ。中央揃え・面の中心に配置。 */
const JA = {
  h:'渋谷にいる今だけ、今日のお題で友達ができる',
  p:['このアプリは、渋谷にいる時しか投稿できない\n今日渋谷で遊んでいる人の投稿だけが載る。',
     '毎日お題が出る。それに乗せてカメラで撮影して投稿する。\nいいねから、知らない人とも会話が始まる。\n同じ趣味の友達、帰りに寄れる飲み友。恋人がいない人は、それ以上になることもある。恋人探しのアプリではない。きっかけが欲しい人の場所だ。']
};
const EN = {
  h:'In Shibuya, today only \u2014 a quest that makes friends',
  p:['You can only post while you are in Shibuya\nOnly posts from people out in Shibuya today show up here.',
     'A quest every day. Answer it with a photo you shoot right there.\nA like is where a conversation with a stranger starts.\nA friend who shares your taste, someone to drink with on the way home. If you are single, it can turn into more. Not a dating app. A place for people who want a reason to start.']
};

function build(d, en, base, hMul, w, lh){
  const b = document.createElement('div');
  b.className = 'box' + (en?' en':'');
  b.style.width = w + 'mm';
  b.style.fontSize = base + 'mm';
  b.style.lineHeight = String(lh);
  let s = '';
  s += '<div style="font-size:'+(base*hMul).toFixed(3)+'mm;font-weight:900;line-height:1.18;letter-spacing:-0.03em;">'+d.h+'</div>';
  d.p.forEach(function(t,i){
    s += '<div style="margin-top:'+(base*(i===0?1.5:1.0)).toFixed(3)+'mm;font-weight:600;">'+t.split('\n').join('<br>')+'</div>';
  });
  b.innerHTML = s;
  return b;
}
const stage = document.getElementById('stage');
function height(d, en, base, hMul, w, lh){
  const b = build(d, en, base, hMul, w, lh);
  stage.appendChild(b);
  const h = b.getBoundingClientRect().height;
  stage.removeChild(b);
  return h;
}
const MM = (()=>{ const p=document.createElement('div'); p.style.width='100mm'; stage.appendChild(p); const v=p.getBoundingClientRect().width/100; stage.removeChild(p); return v; })();
function maxFit(d, en, hMul, w, capMm, lh){
  let lo=0.6, hi=7.0;
  for(let i=0;i<40;i++){
    const mid=(lo+hi)/2;
    if(height(d,en,mid,hMul,w,lh)/MM <= capMm) lo=mid; else hi=mid;
  }
  return lo;
}
/* Inter / Noto Sans JP は colors_and_type.css の入れ子 @import で後から届く。
   fonts.ready だけでは未要求のフェイスを待てず EN が fallback 字形のまま測れて 6% ずれる。 */
function fontsWarm(){
  var probes = ['var(--font-latin)','var(--font-jp)'].map(function(f){
    var p=document.createElement('div');
    p.style.cssText='position:absolute;left:-9999px;top:0;font-weight:900;font-size:10mm;font-family:'+f;
    p.textContent='Toopdbq abc'; document.body.appendChild(p); return p;
  });
  return document.fonts.ready
    .then(function(){ return new Promise(function(r){ setTimeout(r,1200); }); })
    .then(function(){ return document.fonts.ready; })
    .then(function(){ probes.forEach(function(p){ p.remove(); }); });
}
fontsWarm().then(function(){
const lines=[];
lines.push('1mm = '+MM.toFixed(4)+'px');
lines.push('');
lines.push('■ 収まる最大級数（裏面は全面 69x52mm を使う / 中央揃え / 見出し=本文*hMul）');
lines.push('lang  行長mm  行送り  hMul  cap   本文max   見出し   総高    0-52の上下余白 各');
for(const [lang,d,en] of [['JA',JA,false],['EN',EN,true]]){
  for(const w of [69,67,65]){
    for(const lh of [1.55,1.5,1.45]){
      for(const hMul of [1.8,1.6]){
        for(const cap of [52,48,46,44]){
          const b=maxFit(d,en,hMul,w,cap,lh);
          const h=height(d,en,b,hMul,w,lh)/MM;
          lines.push(lang+'    '+String(w).padStart(2)+'     '+lh.toFixed(2)+'   '+hMul.toFixed(1)+'   '+String(cap).padStart(2)+'   '+b.toFixed(2)+'mm    '+(b*hMul).toFixed(2)+'mm   '+h.toFixed(2)+'mm  '+((52-h)/2).toFixed(2)+'mm');
        }
      }
    }
  }
}
lines.push('');
lines.push('■ 各ブロックの y 範囲（0-52mm の中心に総高を centering）と折り線18/40mm・糊代44mm');
for(const [lang,d,en,w,lh,hMul,cap] of [['JA',JA,false,65,1.55,1.8,48],['EN',EN,true,65,1.55,1.8,48]]){
  const base=maxFit(d,en,hMul,w,cap,lh);
  const b=build(d,en,base,hMul,w,lh);
  b.style.position='absolute'; b.style.left='0'; b.style.top='0';
  stage.appendChild(b);
  const total=b.getBoundingClientRect().height/MM;
  const off=(52-total)/2;
  const top=b.getBoundingClientRect().top;
  lines.push('-- '+lang+' (行長'+w+'mm / 行送り'+lh+' / 本文'+base.toFixed(2)+'mm / 見出し'+(base*hMul).toFixed(2)+'mm / 総高'+total.toFixed(2)+'mm / 上下の余り各'+off.toFixed(2)+'mm)');
  const walk=(el,label)=>{
    const r=el.getBoundingClientRect();
    const y0=(r.top-top)/MM+off, y1=(r.bottom-top)/MM+off;
    const hit=[18,40,44].filter(f=>y0<f&&f<y1);
    lines.push('   '+label.padEnd(10)+' y '+y0.toFixed(1)+'-'+y1.toFixed(1)+(hit.length?'   <- '+hit.join('/')+'mm を跨ぐ':''));
  };
  const kids=[...b.children];
  walk(kids[0],'見出し'); walk(kids[1],'本文1'); walk(kids[2],'本文2');
  stage.removeChild(b);
}
lines.push('');
lines.push('■ 見出しの行数（行長63mm・letter-spacing -0.03em）');
for(const [lang,d,en] of [['JA',JA,false],['EN',EN,true]]){
  for(const fs of [3.0,3.5,4.0,4.5]){
    const p=document.createElement('div');
    p.className='box'+(en?' en':'');
    p.style.cssText+='width:63mm;font-size:'+fs+'mm;font-weight:900;line-height:1.18;letter-spacing:-0.03em;';
    p.textContent=d.h; stage.appendChild(p);
    const h=p.getBoundingClientRect().height/MM; stage.removeChild(p);
    lines.push(lang+' '+fs.toFixed(1)+'mm -> 高さ'+h.toFixed(2)+'mm（約'+Math.round(h/(fs*1.18))+'行）');
  }
}
const cnt=d=>(d.h+d.p.join('')).length;
lines.push('');
lines.push('文字数: JA '+cnt(JA)+' / EN '+cnt(EN)+'（EN は JA の '+(cnt(EN)/cnt(JA)).toFixed(2)+' 倍）');
document.getElementById('out').textContent = lines.join('\n');
});
</script></body></html>
