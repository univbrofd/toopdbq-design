<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@import url('../../DesignSystem/colors_and_type.css');
html,body{margin:0;padding:0;background:#000;}
.art{position:relative;width:75mm;height:58mm;overflow:hidden;background:#005f67;}
.grad{position:absolute;left:-12.5mm;top:-21mm;width:100mm;height:100mm;background:var(--gradient-colorful);}
.grain{position:absolute;inset:0;background-image:var(--grain);background-size:35mm 35mm;opacity:.16;mix-blend-mode:overlay;}
.hold{zoom:3;}
</style></head><body>
<!-- グラデ向きの比較ハーネス。?t=<transform> で 1 枚ずつレンダリングする。
     複数タイルを 1 枚に並べるとタイル位置を取り違えて誤読するため、必ず 1 レンダリング 1 グラデで測ること。
     例: contrast-harness.html?t=rotate(200deg)%20scale(1.8) -->
<div class="hold"><div class="art"><div class="grad" id="g"></div><div class="grain"></div></div></div>
<script>
const t=new URLSearchParams(location.search).get('t')||'none';
document.getElementById('g').style.transform=t;
</script></body></html>
