<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@import url('../../DesignSystem/colors_and_type.css');
body{margin:0;background:#0b0b0e;color:#7dffb0;font:13px/1.55 ui-monospace,Menlo,monospace;padding:10px;}
#out{white-space:pre;}
.band{width:69mm;background:#fff;color:#000;display:flex;flex-direction:column;line-height:1.22;}
.r{display:flex;gap:1.0mm;align-items:baseline;} .lb{flex:none;font-weight:700;} .vl{flex:1;}
.hr{border-top:0.3mm solid rgba(0,0,0,.4);margin-top:0.25mm;padding-top:0.25mm;}
table{border-collapse:collapse;width:100%;margin-top:0.25mm;}
td,th{border:0.3mm solid rgba(0,0,0,.4);padding:0 0.4mm;text-align:center;font-weight:400;line-height:1.2;}
th{font-weight:700;}
</style></head><body><div id="out">measuring…</div>
<div id="probe" style="position:absolute;left:-9999px;top:0;"></div>
<div id="mmref" style="position:absolute;left:-9999px;height:100mm;"></div>
<script>
const JA={n:'チューインガム',q:'9枚',
 i:'ぶどう糖（国内製造）、砂糖、還元パラチノース、水あめ、植物油脂、ゼラチン、ウーロン茶抽出物／ガムベース、酸味料、軟化剤、加工でん粉、香料、着色料（クチナシ、紅花黄）、甘味料（アセスルファムK）、増粘多糖類、ヘスペリジン',
 m:'株式会社ロッテ　〒160-0023 東京都新宿区西新宿3-20-1', p:'株式会社ロッテ 狭山工場　埼玉県狭山市新狭山1-2-1',
 a:'●アレルギー物質（28品目）ゼラチン使用。', nt:'栄養成分表示（1パック9枚当り）',
 hd:['熱量','蛋白質','脂質','炭水化物','食塩相当量','ぶどう糖'], vs:['78kcal','0g','0g','20.5g','0.004g','10.0g'],
 L:{n:'名称',q:'内容量',i:'原材料名',m:'製造者',p:'製造所'}};
const EN={n:'Chewing Gum',q:'9 sticks',
 i:'Glucose (produced in Japan), sugar, reduced palatinose, starch syrup, vegetable oil, gelatin, oolong tea extract / gum base, acidulant, softener, modified starch, flavoring, coloring (gardenia, safflower yellow), sweetener (acesulfame K), thickening polysaccharide, hesperidin',
 m:'Lotte Co., Ltd.  3-20-1 Nishi-Shinjuku, Shinjuku-ku, Tokyo 160-0023, Japan',
 p:'Lotte Co., Ltd. Sayama Plant  1-2-1 Shin-Sayama, Sayama-shi, Saitama, Japan',
 a:'●Allergens (28 designated items): contains gelatin.', nt:'Nutrition Facts (per pack / 9 sticks)',
 hd:['Energy','Protein','Fat','Carb.','Salt equiv.','Glucose'], vs:['78 kcal','0 g','0 g','20.5 g','0.004 g','10.0 g'],
 L:{n:'Product name',q:'Net content',i:'Ingredients',m:'Manufacturer',p:'Plant'}};
const head=D=>`
 <div class="r"><span class="lb">${D.L.n}</span><span class="vl">${D.n}</span><span class="lb">${D.L.q}</span><span>${D.q}</span></div>
 <div class="r hr"><span class="lb">${D.L.i}</span><span class="vl">${D.i}</span></div>
 <div class="r hr"><span class="lb">${D.L.m}</span><span class="vl">${D.m}</span></div>
 <div class="r"><span class="lb">${D.L.p}</span><span class="vl">${D.p}</span></div>
 <div class="r hr"><span>${D.a}</span></div>`;
const tbl=D=>`<table><tr><th colspan="6" style="text-align:left">${D.nt}</th></tr>
 <tr>${D.hd.map(h=>'<th>'+h+'</th>').join('')}</tr><tr>${D.vs.map(v=>'<td>'+v+'</td>').join('')}</tr></table>`;
const probe=document.getElementById('probe');
const mmpx=document.getElementById('mmref').getBoundingClientRect().height/100;
function heightMM(D,fs,latin,withTable,padX,padY){
  const b=document.createElement('div'); b.className='band';
  b.style.fontSize=fs+'mm'; b.style.padding=padY+'mm '+padX+'mm';
  if(latin) b.style.fontFamily='var(--font-latin)';
  b.innerHTML=head(D)+(withTable?tbl(D):'');
  probe.appendChild(b); const h=b.getBoundingClientRect().height/mmpx; probe.removeChild(b); return h;
}
const SIZES=[]; for(let f=0.95;f<=2.4001;f+=0.05) SIZES.push(Math.round(f*100)/100);
const out=[];
out.push('69mm 幅・枠18mm。padding を変えたときに収まる最大級数（line-height 1.22 / 罫 0.3mm）');
out.push('');
for(const [nm,D,latin] of [['JA',JA,false],['EN',EN,true]]){
  for(const [vn,wt] of [['A 全部入り(表あり)',true],['C 栄養は下段へ(表なし)',false]]){
    let line=`${nm}  ${vn.padEnd(24)}`;
    for(const pad of [0,0.2,0.4,0.8]){
      let best=null;
      for(const fs of SIZES){ if(heightMM(D,fs,latin,wt,pad,pad)<=18) best=fs; }
      line+=`  pad${pad}=${best?best.toFixed(2):'--'}mm`;
    }
    out.push(line);
  }
}
document.getElementById('out').textContent=out.join('\n');
</script></body></html>
