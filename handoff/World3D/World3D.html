<!--

  出しているデータは**渋谷のナイトクラブ 20 件だけ**（本番 DB の場所 = Places 由来。
  位置・店の写真・ジャンル・営業時間・評価を持つ）。開発用のモック（サークル / 投稿 / お題）は出さない。
  既定の「ポイント」は **光の柱（90m）の先端に店の写真**。操作盤で 地上の写真タイル（アプリの場所ピン）/
  柱だけ / 赤いマーカー にも切り替えられる。

  engine / vendor / data は R2（https://media.toopdbq.com/design/world3d/…）から読む。
  engine = アプリ実装（assets/web/earth/*.js）の一方向の写しなので、ここから編集しない。
  新しい 3D 表現は **このページの中**（下の host スクリプトか、その下に足す自分の script）で
  MapLibre の custom layer / three.js として書く。map インスタンスは `map` でグローバルに触れる。

  受け取り方・守る値・戻し方は同じフォルダの HANDOFF.md を読む。

<!-- data: 本番 DB の場所（placeDetails）から渋谷のナイトクラブだけを抜いた生成物 -->
<script src="https://media.toopdbq.com/design/world3d/data.js?v=d2e3e1ad"></script>
<script>
// engine（map-core.js）は**自分が読み込まれた瞬間の URL クエリ**（lat / lng / zoom / pitch / bearing）で
// 初回カメラを確定する。engine より前にここで data のエリアとページの既定を書いておけば、起動の瞬間から
// 目的の構図になる（後から setCamera で当て直すと engine の初回確定と競合して構図が飛ぶ）。
// URL で明示された値はそのまま残す（?zoom=17 等が勝つ）。
(function () {
  try {
    const a = (window.World3DData || {}).area;
    const u = new URL(location.href);
    const set = (k, v) => { if (!u.searchParams.has(k)) u.searchParams.set(k, String(v)); };
    // 既定の構図（渋谷・北向き・80° 傾け）
    set('lat', '35.67891'); set('lng', '139.69910');
    set('zoom', 14.19); set('pitch', 60); set('bearing', 0);
    history.replaceState(null, '', u);
  } catch (_) {}
})();
</script>

<!-- engine: アプリ実装 assets/web/earth/*.js の写し。読み込み順は earth.html と同じ -->
<script src="https://media.toopdbq.com/design/world3d/engine/bridge.js?v=d2e3e1ad"></script>
<script src="https://media.toopdbq.com/design/world3d/engine/map-core.js?v=d2e3e1ad"></script>
<script src="https://media.toopdbq.com/design/world3d/engine/pins.js?v=d2e3e1ad"></script>

<script src="https://media.toopdbq.com/design/world3d/engine/places.js?v=d2e3e1ad"></script>

<script>
// ============================================================================
// host — 実機で Flutter がやっている役（カメラ操作・データ投入・指の入力）の代役。
// アプリでは WebView がタッチを受けず Flutter が全部送るので、engine 側は
// MapLibre の標準ハンドラを切っている。ここではサンドボックスなので触れるように戻す。
// ============================================================================
(function () {
  const D = window.World3DData || {};
  if (!Array.isArray(D.clubs)) D.clubs = [];
  const STATION = Number.isFinite(D.station?.lat) ? D.station : { lat: 35.658034, lng: 139.701636 };
  const AREA = Number.isFinite(D.area?.lat)
    ? D.area
    : { lat: STATION.lat, lng: STATION.lng, radiusMeters: 500, label: '渋谷' };
  const P = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) ? v : d; };
  const on = (k, d) => (P.get(k) == null ? d : P.get(k) !== '0');

  // URL クエリで初期状態を指定できる
  // （?style=liberty&pitch=60&points=photo|beam|pin|off&labels=0&wall=1&buildings=0&clubonly=1&framed=1&zoom=17&bearing=30&dim=.6）
  const S = {
    lat: num('lat', 35.67891),
    lng: num('lng', 139.69910),
    zoom: num('zoom', 14.19),
    pitch: num('pitch', 60),
    bearing: num('bearing', 0),
    style: P.get('style') === 'liberty' ? 'liberty' : 'dark',   // 夜の街が主題なので既定は dark

    points: ['both', 'beam', 'photo', 'pin', 'off'].includes(P.get('points')) ? P.get('points') : 'both',

    clubOnly: on('clubonly', false),

  const stage = document.getElementById('stage');

  // style の読み込み完了待ち。MapLibre は style 切替の途中でも idle を撃つので、

  const visible = () => D.clubs.filter((c) => !S.clubOnly || c.kind === 'club');

  // --- カメラ（engine の公開 API。実機と同じ入口） ---------------------------

  const MAX_PITCH = 85;

  // engine は起動時に一度だけ「初回カメラ確定」で URL クエリの既定（zoom 6.4・東京駅）へ
  // jumpTo する（style.load / 即時ガード / 1s ポーリングの三重なので発火の順が読めない）。
  // ページの構図がそれに負けないよう、指が触るまでの数秒だけ当て直す。engine の確定は
  // 一度きりなので必ず収束する。
  let camHeld = false;
  function holdCamera(ms) {
    const t0 = Date.now();
    const tick = () => {
      if (camHeld) return;
      const c = map.getCenter();
      const off = Math.abs(c.lat - S.lat) > 1e-4 || Math.abs(c.lng - S.lng) > 1e-4
        || Math.abs(map.getZoom() - S.zoom) > 0.02 || Math.abs(map.getPitch() - S.pitch) > 0.5;
      if (off) applyCamera();
      if (Date.now() - t0 < ms) setTimeout(tick, 150);
    };
    // 止めるのは**指の操作だけ**。originalEvent を持たないイベントは自分の jumpTo が出したもの
    // （setPitch の pitchstart で自分を止めてしまうため）
    ['dragstart', 'wheel', 'touchstart', 'pitchstart', 'rotatestart']
      .forEach((ev) => map.on(ev, (e) => { if (e && e.originalEvent) camHeld = true; }));
    tick();
  }

  // --- ポイント（このページ固有の層 = 新機能の「点」の素） -------------------
  // 光の柱: 地点に半径 7m の多角形を置いて fill-extrusion で 60m 立てる + 地面のにじみ。
  // 高さ・色を data の値（rating / ratingCount / overnight / closeHour）で振るのはデザインの判断。
  const SRC_PT = 'w3d-club-pts', SRC_BEAM = 'w3d-club-beams';
  const L_DISC = 'w3d-club-disc', L_BEAM = 'w3d-club-beam';
  const POINT_COLOR = '#ff3e88';  // DS の --state-like / --grad-pink（アプリの唯一のアクセント）
  // 柱は渋谷のビル（おおむね 20〜80m）より高くして、先端の写真が屋上に埋もれないようにする
  const BEAM_R_M = 7, BEAM_H_M = 90;
  // 柱の長さは拡大率によらず画面上で一定にする：zoom 13.8 のときの長さを基準に、m を 2^(13.8 - zoom) 倍する
  const REF_Z = 13.8;
  const zk = () => Math.pow(2, REF_Z - map.getZoom());

  function discRing(lat, lng, rM, seg) {
    const dLat = rM / 111320, dLng = rM / (111320 * Math.cos(lat * Math.PI / 180));
    const ring = [];
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * Math.PI * 2;
      ring.push([lng + Math.cos(t) * dLng, lat + Math.sin(t) * dLat]);
    }
    return [ring];
  }
  const feat = (c, geometry) => ({
    type: 'Feature',
    properties: { i: D.clubs.indexOf(c), kind: c.kind, h: BEAM_H_M },
    geometry,
  });
  const ptGeo = (list) => ({
    type: 'FeatureCollection',
    features: list.map((c) => feat(c, { type: 'Point', coordinates: [c.lng, c.lat] })),
  });
  const beamGeo = (list) => ({
    type: 'FeatureCollection',
    features: list.map((c) => feat(c, { type: 'Polygon', coordinates: discRing(c.lat, c.lng, BEAM_R_M, 12) })),
  });
  function setGeo(id, geo) {
    const src = map.getSource(id);
    if (src) src.setData(geo);
    else map.addSource(id, { type: 'geojson', data: geo });
  }
  function ensurePointLayers() {
    if (!map.getLayer(L_DISC)) {
      map.addLayer({
        id: L_DISC, type: 'circle', source: SRC_PT,
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 2.5, 16, 7, 18, 14],
          'circle-color': POINT_COLOR,
          'circle-opacity': ['case', ['==', ['get', 'kind'], 'club'], 0.9, 0.55],
          'circle-blur': 0.6,
        },
      });
    }
    if (!map.getLayer(L_BEAM)) {
      map.addLayer({
        id: L_BEAM, type: 'fill-extrusion', source: SRC_BEAM,
        paint: {
          'fill-extrusion-color': POINT_COLOR,
          'fill-extrusion-height': ['interpolate', ['exponential', 2], ['zoom'],
            0, ['*', ['get', 'h'], Math.pow(2, REF_Z)], 24, ['*', ['get', 'h'], Math.pow(2, REF_Z - 24)]],

  }
  // 柱の先端の写真（DOM）。投影は engine が壁の名前で使っているのと同じ
  //   transform.coordinatePoint(MercatorCoordinate, z[m]) — pixelMatrix が z を m でスケール済み。
  // globe 描画中（引いたとき）は取れないので地表の投影で代用する。
  const tipsHost = document.getElementById('tips');
  let tips = [];
  function tipPx(c) {
    try {
      const tr = map.transform;
      const mt = tr.currentTransform || tr;
      if (typeof mt.coordinatePoint === 'function') {
        return mt.coordinatePoint(
          maplibregl.MercatorCoordinate.fromLngLat({ lng: c.lng, lat: c.lat }), BEAM_H_M * zk());
      }

    return map.project([c.lng, c.lat]);
  }
  function positionTips() {
    if (!tips.length) return;
    const w = stage.clientWidth, h = stage.clientHeight;
    for (const t of tips) {
      const p = tipPx(t.c);
      if (!p || !Number.isFinite(p.x) || p.x < -120 || p.y < -140 || p.x > w + 120 || p.y > h + 140) {
        t.el.style.visibility = 'hidden';
        continue;
      }
      t.el.style.visibility = '';
      // 要素の下辺の中央 = 柱の先端
      t.el.style.transform = `translate(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px) translate(-50%, -100%)`;
    }
  }
  function buildTips(list) {
    tipsHost.textContent = '';
    tips = list.map((c) => {
      const el = document.createElement('div');
      el.className = 'tip' + (c.kind === 'club' ? '' : ' lounge');

      nm.textContent = c.name;
      nm.hidden = !S.labels;
      el.appendChild(nm);
      el.addEventListener('click', (e) => { e.stopPropagation(); showCard(c); });
      tipsHost.appendChild(el);
      return { c, el, nm };
    });
    positionTips();
  }

  // --- 白い柱 + 先端の写真の束（写真+柱）-------------------------------------------
  // 近い店（150m 以内・最大 7 軒）を 1 本の柱にまとめ、柱は束の先頭（評価の高い店）の位置に立てる。
  // 画面の判定点に最も近い 1 本だけ 400m に伸びて写真を展開、他は 100m で上位 3 枚を重ねた束。
  // 柱は fill-extrusion だと光源で側面が灰色になるので、陰影なしの純白を custom layer で描く。
  const POLE = 'w3d-pole', POLE_H = 400, POLE_LOW = 100, PHOTO = 96, EASE = 'cubic-bezier(.4,0,.2,1)';
  const POLE_LAYOUT = {
    1: [[0, 0]],
    2: [[-40, 0], [40, 0]],
    3: [[0, -100], [-42, 0], [42, 0]],
    4: [[-40, -100], [42, -104], [-44, 0], [40, 0]],
    5: [[-40, -102], [44, -100], [-78, 0], [2, -4], [80, 2]],
    6: [[-76, -104], [4, -110], [82, -98], [-72, 0], [8, -6], [86, 4]],
    7: [[-46, -206], [40, -214], [-82, -106], [5, -98], [86, -110], [-41, -8], [48, 0]],
  };
  const RK_POS = [[201, 96, 268, 151], [102, 246, 176, 99], [300, 246, 176, 99]];
  const RK_SZ = [[23.4, 13.3, 11.7], [20.3, 11.7, 10.1], [17.9, 10.1, 9]]; // [帯の高さ, 名前, 順位]（プロフィール一覧の k=0.78）
  const RK_ORD = ['1<small>st</small>', '2<small>nd</small>', '3<small>rd</small>'];
  const RK_OPEN = 0.66, RK_SHUT = 0.28;
  const rkLat = (s) => !/[\u3040-\u30ff\u4e00-\u9fff]/.test(s);
  const rkEsc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const rkRnd = (s) => { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return ((x >>> 0) % 10000) / 10000; };
  const mDist = (a, b) => Math.hypot((a.lat - b.lat) * 111320, (a.lng - b.lng) * 111320 * Math.cos(a.lat * Math.PI / 180));
  function groupClubs(list) {
    const score = (c) => (c.rating || 0) * Math.log10(10 + (c.ratingCount || 0));
    const rest = list.filter((c) => c.imageUrl).sort((a, b) => score(b) - score(a));
    const out = [];
    while (rest.length) {
      const head = rest.shift();
      const near = rest.map((c) => [c, mDist(head, c)]).filter(([, d]) => d <= 150)
        .sort((a, b) => a[1] - b[1]).slice(0, 6).map(([c]) => c);
      near.forEach((c) => rest.splice(rest.indexOf(c), 1));
      out.push([head, ...near]);
    }
    return out;
  }
  function applyPoles(list) {
    if (map.getLayer(POLE)) map.removeLayer(POLE);
    document.querySelectorAll('.w3d-pole-img').forEach((n) => n.remove());
    if (!list.length) return;
    const M = (p, z) => maplibregl.MercatorCoordinate.fromLngLat(p, z);
    let seed = 20260923;
    const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
    const v = [], poles = [], sheetItems = [];
    for (const group of groupClubs(list)) {
      const { lat, lng } = group[0];
      const w = 1.5, dLat = w / 111320, dLng = w / (111320 * Math.cos(lat * Math.PI / 180));
      const ring = [[lng - dLng, lat - dLat], [lng + dLng, lat - dLat], [lng + dLng, lat + dLat], [lng - dLng, lat + dLat]].map((p) => M(p, 0));
      const first = v.length / 4;
      const push = (q, top) => v.push(q.x, q.y, q.z, top);
      const quad = (a, b) => { push(a, 0); push(b, 0); push(b, 1); push(a, 0); push(b, 1); push(a, 1); };
      for (let i = 0; i < 4; i++) quad(ring[i], ring[(i + 1) % 4]);
      [0, 1, 2, 0, 2, 3].forEach((i) => push(ring[i], 1));
      // プロフィールのランキングタブの 1 本（393×330 の台紙）をそのまま柱の先端に載せる
      const el = document.createElement('div');
      el.className = 'w3d-pole-img';
      Object.assign(el.style, { position: 'absolute', left: '0', top: '0', width: '0', height: '0', pointerEvents: 'none', willChange: 'transform' });
      const card = document.createElement('div');
      card.className = 'w3r';
      const top3 = group.slice(0, 3);
      // 展開 = App-ProfileRanking-Dark の一覧 1 本 / 束 = メイン写真を正方形にして中心へ、1・2・3 位をその後ろに寄せる
      const SQ = 200, SX = 196.5 - SQ / 2, SY = 472 - SQ - 6;
      const cr = (rkRnd(group[0].name + 'c') * 2 - 1) * 2.5;
      const cover = document.createElement('div');
      cover.className = 'w3r-cv'; cover.dataset.i = '0';
      cover.innerHTML = '<img src="' + group[0].imageUrl + '" alt=""><i></i>';
      cover._o = { left: '2px', top: '20px', width: '389px', height: '232px', transform: 'rotate(' + cr.toFixed(1) + 'deg)' };
      cover._s = { left: SX + 'px', top: SY + 'px', width: SQ + 'px', height: SQ + 'px', transform: 'rotate(' + (cr * 0.6).toFixed(1) + 'deg)' };
      card.appendChild(cover);
      const parts = [cover];
      const cw = (393 - 12) / 3, ctop = 14 + 232 + 22;
      top3.forEach((c, j) => {
        const cx = 6 + cw * j + cw / 2, z = [30, 28, 26][j];
        const rot = (rkRnd(c.name + 'r') * 2 - 1) * 10, dx = (rkRnd(c.name + 'x') * 2 - 1) * 6, nr = (rkRnd(c.name + 'n') * 2 - 1) * 9;
        const nw = Math.min(cw + 4, 128);
        let tw = 0; for (const ch of c.name) tw += /[\u3000-\u9fff\uff00-\uffef]/.test(ch) ? 12 : 7.4;
        const ph = document.createElement('div');
        ph.className = 'w3r-ph'; ph.dataset.i = String(j); ph.style.zIndex = String(z - 20);
        ph.innerHTML = '<img src="' + c.imageUrl + '" alt="">';
        ph._o = { left: (cx - 71 + dx).toFixed(1) + 'px', top: ctop + 'px', transform: 'rotate(' + rot.toFixed(1) + 'deg)', zIndex: String(z) };
        // 束: 正方形の後ろで扇状に（左右と上にだけ覗く）
        const sdx = [0, -58, 58][j], sdy = [-40, -14, -14][j], srot = [3, -11, 12][j];
        ph._s = { left: (196.5 - 71 + sdx) + 'px', top: (SY + sdy) + 'px', transform: 'rotate(' + srot + 'deg) scale(.82)', zIndex: String(10 - j) };
        const nm = document.createElement('div');
        nm.className = 'w3r-nm'; nm.dataset.i = String(j);
        nm.innerHTML = '<span class="o">' + RK_ORD[j] + '</span><span class="t' + (rkLat(c.name) ? ' lat' : '') + '" style="font-size:' + (tw > nw - 42 ? 10 : 12) + 'px">' + rkEsc(c.name) + '</span>';
        nm._o = { left: (cx - dx * 0.5).toFixed(1) + 'px', top: (ctop - 12) + 'px', maxWidth: nw.toFixed(0) + 'px', transform: 'translateX(-50%) rotate(' + nr.toFixed(1) + 'deg)', zIndex: String(z + 1) };
        // 束: 順位だけを正方形の下辺に 1・2・3 と並べる
        nm._s = { left: (196.5 + (j - 1) * 62) + 'px', top: (SY + SQ - 30 - (j === 0 ? 8 : 0)) + 'px', maxWidth: '200px', transform: 'translateX(-50%) rotate(' + [-4, 5, -6][j] + 'deg) scale(' + (j === 0 ? 1.9 : 1.5) + ')', zIndex: String(40 - j) };
        card.appendChild(ph); card.appendChild(nm);
        parts.push(ph, nm);
      });
      const tout = document.createElement('div');
      tout.className = 'w3r-tout';
      tout.innerHTML = '<div class="l1">' + rkEsc(group[0].name) + ' 周辺</div><div class="l2">BEST ' + group.length + '</div>';
      card.appendChild(tout);
      card._parts = parts;
      sheetItems.push({ group, card });
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        if (card._post) {
          setSheet('half');
          rsList.scrollTo({ top: card._post.offsetTop, behavior: 'smooth' });
        }
      });
      el.appendChild(card);
      tipsHost.appendChild(el);
      poles.push({ lat, lng, el, card, first, count: v.length / 4 - first, unit: M([lng, lat], 1).z, base: M([lng, lat], 0), h: POLE_LOW, open: null });
    }
    const setOpen = (p, open) => {
      if (p.open === open) return;
      p.open = open;
      p.card.style.transform = 'scale(' + (open ? RK_OPEN : RK_SHUT) + ')';
      p.card.classList.toggle('open', open);
      p.card._parts.forEach((n) => Object.assign(n.style, open ? n._o : n._s));
    };
    // 伸びた柱は奥の束の写真（DOM）に隠れないよう、DOM の線でも重ねて前面に出す
    const stick = document.createElement('div');
    stick.className = 'w3d-pole-img';
    Object.assign(stick.style, { position: 'absolute', left: '0', top: '0', height: '3px', background: '#ffffff', transformOrigin: '0 50%', pointerEvents: 'none', zIndex: '99999', willChange: 'transform' });
    tipsHost.appendChild(stick);
    renderSheet(sheetItems);
    const verts = new Float32Array(v);
    map.addLayer({
      id: POLE, type: 'custom', renderingMode: '3d',
      onAdd(_m, gl) {
        const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
        this.prog = gl.createProgram();
        gl.attachShader(this.prog, sh(gl.VERTEX_SHADER, 'uniform mat4 u_m; uniform float u_h; attribute vec4 a_p; void main(){ gl_Position = u_m * vec4(a_p.x, a_p.y, a_p.z + a_p.w * u_h, 1.0); }'));
        gl.attachShader(this.prog, sh(gl.FRAGMENT_SHADER, 'precision mediump float; void main(){ gl_FragColor = vec4(1.0); }'));
        gl.linkProgram(this.prog);
        this.aP = gl.getAttribLocation(this.prog, 'a_p');

        this.uH = gl.getUniformLocation(this.prog, 'u_h');

        gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);

      },
      render(gl, args) {

        const now = performance.now(), dt = Math.min(64, now - this.t); this.t = now;
        // 判定点：地図の center から、傾けた分だけ画面下（bearing 0 なら南）へずらす
        const cv = map.getCanvas();
        const c = map.unproject([cv.clientWidth / 2, judgeY()]), cosL = Math.cos(c.lat * Math.PI / 180);
        let near = poles[0], best = Infinity;
        for (const p of poles) {
          const d = (p.lat - c.lat) ** 2 + ((p.lng - c.lng) * cosL) ** 2;
          if (d < best) { best = d; near = p; }

        gl.useProgram(this.prog);
        gl.uniformMatrix4fv(this.uM, false, m);
        gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
        gl.enableVertexAttribArray(this.aP);
        gl.vertexAttribPointer(this.aP, 4, gl.FLOAT, false, 0, 0);
        gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
        let moving = false;
        const k = zk();
        for (const p of poles) {
          const target = p === near ? POLE_H : POLE_LOW;
          p.h += (target - p.h) * (1 - Math.exp(-dt / 110));
          if (Math.abs(target - p.h) < 0.5) p.h = target; else moving = true;
          setOpen(p, p === near);
          gl.uniform1f(this.uH, p.h * k * p.unit);
          gl.drawArrays(gl.TRIANGLES, p.first, p.count);
          const proj = (x, y, z) => {
            const w = m[3]*x + m[7]*y + m[11]*z + m[15];
            if (w <= 0) return null;
            return [((m[0]*x + m[4]*y + m[8]*z + m[12]) / w * 0.5 + 0.5) * cv.clientWidth, (0.5 - (m[1]*x + m[5]*y + m[9]*z + m[13]) / w * 0.5) * cv.clientHeight];
          };
          const top = proj(p.base.x, p.base.y, p.base.z + p.h * k * p.unit);
          if (p === near) {
            const bot = proj(p.base.x, p.base.y, p.base.z);
            if (top && bot) {
              const dx = top[0] - bot[0], dy = top[1] - bot[1];
              stick.style.display = '';
              stick.style.width = Math.hypot(dx, dy).toFixed(1) + 'px';
              stick.style.transform = `translate(${bot[0]}px, ${bot[1] - 1.5}px) rotate(${Math.atan2(dy, dx)}rad)`;
            } else stick.style.display = 'none';
          }
          if (!top) { p.el.style.display = 'none'; continue; }
          const [sx, sy] = top;
          p.el.style.display = '';
          p.el.style.zIndex = String(p === near ? 100000 : 2 + Math.max(0, Math.round(sy))); // 手前（画面下）ほど上
          p.el.style.transform = `translate(${sx}px, ${sy}px)`;
        }
        if (moving) map.triggerRepaint();
      },
    });
  }

  // --- ランキング投稿のタイムライン（柱の先端と同じ 1 本を、いろんなユーザーの投稿として縦に並べる） ---
  const RS_USERS = ['SunnyVi', 'Kawaii', 'Dreamy', 'foodie', 'Pixel', 'ZenGarden', 'Starry', 'o_cean', 'Mocha'];
  const RS_TIME = ['12分前', '1時間前', '3時間前', '昨日', '2日前', '3日前', '5日前', '1週間前', '2週間前'];
  const rsList = document.getElementById('rs-list');
  function renderSheet(items) {
    rsList.textContent = '';
    items.forEach(({ group, card }, i) => {
      const post = document.createElement('section');
      post.className = 'rs-post';
      const u = RS_USERS[i % RS_USERS.length];
      post.innerHTML = '<div class="rs-ub"><img src="../../assets/sample/user/user' + String((i % 16) + 1).padStart(3, '0') + '.jpg" alt=""><span class="nm">' + u + '</span><span class="pl"><img src="../../assets/icons/icon_pin_location.png" alt=""><span>' + rkEsc(group[0].name) + '</span></span></div>';
      const st = document.createElement('div');
      st.className = 'rs-stage';
      const cl = card.cloneNode(true);
      cl.classList.add('open');
      cl.querySelectorAll('.w3r-cv, .w3r-ph, .w3r-nm').forEach((n, k) => Object.assign(n.style, card._parts[k]._o));
      st.appendChild(cl);
      card._post = post;
      post.appendChild(st);
      const act = document.createElement('div');
      act.className = 'rs-act';
      const lk = 12 + Math.floor(rkRnd(u + 'l') * 240), cm = Math.floor(rkRnd(u + 'c') * 24);
      act.innerHTML = '<button type="button" data-a="like"><img src="../../assets/icons/icon_like.png" alt=""><span>' + lk + '</span></button>'
        + '<button type="button"><img src="../../assets/icons/icon_comment.png" alt=""><span>' + cm + '</span></button>'
        + '<button type="button"><img src="../../assets/icons/icon_share.png" alt=""></button>'
        + '<span class="tm">' + RS_TIME[i % RS_TIME.length] + '</span>';
      act.addEventListener('click', (e) => {
        e.stopPropagation();
        const b = e.target.closest('[data-a="like"]'); if (!b) return;
        const onL = b.classList.toggle('on');
        b.querySelector('img').src = '../../assets/icons/icon_like' + (onL ? '_fill' : '') + '.png';
        b.querySelector('span').textContent = lk + (onL ? 1 : 0);
      });
      post.appendChild(act);
      post.addEventListener('click', () => {
        map.easeTo({ center: [group[0].lng, group[0].lat], offset: [0, judgeY() - stage.clientHeight / 2], duration: 700 });
      });
      rsList.appendChild(post);
    });
  }
  const rsSheet = document.getElementById('rk-sheet');
  const applySheet = () => { rsSheet.hidden = !S.sheet; };
  // シートの高さ = short（地図を触っているとき）/ half（初期）/ full
  let sheetState = 'half', lock = 0, atTop = 0;
  function setSheet(s) {
    if (sheetState === s) return;
    sheetState = s; rsSheet.dataset.s = s; lock = Date.now();
    setTimeout(() => map.triggerRepaint(), 340);
  }
  const UP = { short: 'half', half: 'full', full: 'full' }, DOWN = { short: 'short', half: 'short', full: 'half' };
  rsList.addEventListener('scroll', () => { if (rsList.scrollTop <= 0 && !atTop) atTop = Date.now(); if (rsList.scrollTop > 0) atTop = 0; });
  rsList.addEventListener('wheel', (e) => {
    const top = rsList.scrollTop <= 0;
    if (sheetState === 'full' && !(e.deltaY < 0 && top)) return;
    e.preventDefault();
    if (Date.now() - lock < 600 || Math.abs(e.deltaY) < 4) return;
    if (e.deltaY > 0) setSheet(UP[sheetState]);
    else if (sheetState !== 'full' || !atTop || Date.now() - atTop > 250) setSheet(DOWN[sheetState]);
  }, { passive: false });
  let ty = null, tTop = false;
  rsList.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; tTop = rsList.scrollTop <= 0; }, { passive: true });
  rsList.addEventListener('touchmove', (e) => {
    if (ty == null) return;
    const dy = e.touches[0].clientY - ty;
    if (sheetState !== 'full' || (tTop && dy > 0 && rsList.scrollTop <= 0)) e.preventDefault();
  }, { passive: false });
  rsList.addEventListener('touchend', (e) => {
    if (ty == null) return;
    const dy = e.changedTouches[0].clientY - ty; ty = null;
    if (sheetState !== 'full') { if (dy < -30) setSheet(UP[sheetState]); else if (dy > 30) setSheet(DOWN[sheetState]); }
    else if (tTop && dy > 40) setSheet('half');
  });
  // 中心判定の高さ = シートのすぐ上（シートを出していないときは従来の傾き連動）
  function judgeY() {
    const h = stage.clientHeight;
    if (rsSheet.hidden) return h * (0.5 + 0.22 * Math.min(1, map.getPitch() / 60));
    const top = rsSheet.getBoundingClientRect().top - stage.getBoundingClientRect().top;
    return Math.max(0, Math.min(h, top - 28));
  }

  let labelMarkers = [];
  function applyLabels() {
    // 「写真+柱」のときは名前を先端の写真の下に出す（別マーカーにしない）
    for (const t of tips) t.nm.hidden = !S.labels;
    labelMarkers.forEach((m) => m.remove());
    labelMarkers = [];
    if (!S.labels || S.points === 'off' || S.points === 'both') return;
    for (const c of visible()) {
      const el = document.createElement('div');
      el.className = 'club-label' + (c.kind === 'club' ? '' : ' lounge');
      el.textContent = c.name;
      el.addEventListener('click', (e) => { e.stopPropagation(); showCard(c); });
      labelMarkers.push(new maplibregl.Marker({
        // 写真タイル（36）の下に出す。柱 / マーカーのときは地点のすぐ下
        element: el, anchor: 'top',
        offset: [0, (S.points === 'both' || S.points === 'photo') ? 22 : 10],
        pitchAlignment: 'viewport', rotationAlignment: 'viewport',
      }).setLngLat([c.lng, c.lat]).addTo(map));
    }
  }
  function applyPoints() {
    if (!map.isStyleLoaded()) { whenReady(applyPoints); return; }
    const list = visible();
    // 「写真」「マーカー」は engine の場所ピン（地面に置くアプリの既存ボキャブラリそのもの）
    if (S.points === 'photo' || S.points === 'pin') {
      window.setPlacePins({
        pins: list.map((c) => ({ key: c.key, lat: c.lat, lng: c.lng, imageUrl: c.imageUrl })),
        style: S.points === 'photo' ? 'tile' : 'pin',
      });
    } else {
      window.clearPlacePins();
    }
    // 「写真+柱」は柱の先端に写真を置く（このページ固有の 3D 表現）
    buildTips([]);
    applyPoles(S.points === 'both' ? list : []);
    const beam = S.points === 'beam' ? list : [];
    setGeo(SRC_PT, ptGeo(beam));
    setGeo(SRC_BEAM, beamGeo(beam));
    ensurePointLayers();
    applyLabels();
  }

  // --- クラブ街の壁（アプリ既存の 3D ボキャブラリ。点の範囲から出した円） -----
  function applyWall() {
    if (!S.wall) { window.clearCircleFocusArea(); return; }
    window.setCircleFocusArea({
      lat: AREA.lat, lng: AREA.lng, radiusMeters: AREA.radiusMeters,
      // 実機は画面比で渡す（下に一覧やシートが来る構図。ここは画面高の 23% を上に空ける）
      padTop: Math.round(stage.clientHeight * 0.23), padBottom: 0,
      label: AREA.label,
    });
  }

  // 3D ビル。liberty には style 標準の building-3d があるが dark には fill-extrusion が
  // 1 枚も無い（openfreemap dark の仕様）ので、同じ vector source から自前で立てる。
  const OWN_BUILDINGS = 'w3d-buildings';
  function applyBuildings() {
    if (!map.isStyleLoaded()) { whenReady(applyBuildings); return; }
    const own = map.getLayer(OWN_BUILDINGS);
    if (S.style === 'dark') {
      if (S.buildings && !own) {
        map.addLayer({
          id: OWN_BUILDINGS, type: 'fill-extrusion', source: 'openmaptiles',
          'source-layer': 'building', minzoom: 14,
          paint: {
            'fill-extrusion-color': '#1c2029',
            'fill-extrusion-height': ['get', 'render_height'],
            'fill-extrusion-base': ['get', 'render_min_height'],
            'fill-extrusion-opacity': 0.9,
          },
        }, map.getLayer(L_DISC) ? L_DISC : undefined); // 点はビルより手前
        applyWall(); // 壁は常に最前面（circles.js が layer を持ち上げ直す）
      } else if (!S.buildings && own) {
        map.removeLayer(OWN_BUILDINGS);
      }
      return;
    }
    if (own) map.removeLayer(OWN_BUILDINGS);
    for (const l of (map.getStyle().layers || [])) {
      if (l.type !== 'fill-extrusion' || l.id === L_BEAM) continue;
      try { map.setLayoutProperty(l.id, 'visibility', S.buildings ? 'visible' : 'none'); } catch (_) {}
    }
  }

  // setMapStyle は style 由来の layer / source / image を捨てるので、読み込み完了後に貼り直す。
  function switchStyle(name) {
    window.setMapStyle(name);
    whenReady(() => { applyAll(); syncUi(); });
  }
  function applyAll() {
    applyPoints(); applyWall(); applyBuildings();
    window.setMapDim(S.dim);
  }

  // --- 点が持っている値の確認（デザインではない） ----------------------------
  function showCard(c) {
    const kv = [];
    if (c.genreLabel || c.genre) kv.push(`${c.genreLabel || c.genre}${c.kind === 'club' ? '' : '（型で拾った夜の店）'}`);
    if (c.rating != null) kv.push(`★ ${c.rating}（${c.ratingCount ?? 0} 件）`);
    if (c.open) kv.push(`${c.open}–${c.close || '?'}${c.overnight ? ' 深夜' : ''}`);
    if (c.address) kv.push(c.address);
    kv.push(`渋谷駅から ${c.distanceM}m`);
    card.innerHTML = `<span class="x">×</span>`
      + (c.imageUrl ? `<img src="${c.imageUrl}" alt="">` : '')
      + `<div class="nm">${c.name}</div><div class="kv">${kv.join('<br>')}</div>`
      + (c.mapsUrl ? `<div class="kv"><a href="${c.mapsUrl}" target="_blank" rel="noopener">Google マップ</a></div>` : '');
    card.hidden = false;
    card.querySelector('.x').addEventListener('click', () => { card.hidden = true; });
  }

  // --- 指の入力（実機では Flutter が送る。ここは MapLibre のハンドラを戻す） ---
  function enableInput() {
    ['scrollZoom', 'dragPan', 'dragRotate', 'touchZoomRotate', 'touchPitch', 'keyboard', 'doubleClickZoom']
      .forEach((k) => { try { map[k] && map[k].enable(); } catch (_) {} });
  }

  // --- 操作盤 ---------------------------------------------------------------
  function syncUi() {
    document.querySelectorAll('#sandbox button').forEach((b) => {
      const act = b.dataset.act, v = b.dataset.v;
      const pressed =
        act === 'style' ? S.style === v :
        act === 'pitch' ? Math.round(map.getPitch()) === Number(v) :
        act === 'points' ? S.points === v :
        act === 'frame' ? (S.framed ? v === '1' : v === '0') :
        act === 'toggle' ? !!S[v] : false;
      b.setAttribute('aria-pressed', String(pressed));
    });
    document.getElementById('dim').value = String(S.dim);
  }
  document.getElementById('sandbox').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const { act, v } = b.dataset;
    if (act === 'style') { S.style = v; switchStyle(v); }
    if (act === 'pitch') { S.pitch = Number(v); pitchTo(S.pitch); }
    if (act === 'points') { S.points = v; applyPoints(); }
    if (act === 'frame') {
      S.framed = v === '1';
      document.body.classList.toggle('framed', S.framed);
      requestAnimationFrame(() => { map.resize(); applyWall(); positionTips(); });
    }
    if (act === 'toggle') {
      S[v] = !S[v];
      if (v === 'labels') applyLabels();
      if (v === 'clubOnly') applyPoints();
      if (v === 'wall') applyWall();
      if (v === 'buildings') applyBuildings();
      if (v === 'sheet') applySheet();
    }
    syncUi();
  });
  const panel = document.getElementById('sandbox');
  const unfold = document.getElementById('unfold');
  document.getElementById('fold').addEventListener('click', () => {
    panel.hidden = true; unfold.hidden = false; readout.hidden = true;
  });
  unfold.addEventListener('click', () => {
    panel.hidden = false; unfold.hidden = true; readout.hidden = false;
  });
  document.getElementById('dim').addEventListener('input', (e) => {
    S.dim = Number(e.target.value); window.setMapDim(S.dim);
  });

  // --- カメラの数値を右上に出す（構図を決めるときの物差し） -------------------
  function paint() {
    const c = map.getCenter();
    readout.textContent =
      `zoom ${map.getZoom().toFixed(2)}  pitch ${map.getPitch().toFixed(0)}°  bearing ${map.getBearing().toFixed(0)}°\n`
      + `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}  /  ポイント ${visible().length}`;
    readout.style.whiteSpace = 'pre';
  }

  // --- 起動 -----------------------------------------------------------------
  document.body.classList.toggle('framed', S.framed);
  applySheet();
  whenReady(() => {
    map.setMaxPitch(MAX_PITCH);
    enableInput();
    applyCamera();
    holdCamera(6000);
    // ?style=… が liberty 以外なら style.load を待ってから貼る（switchStyle が完了後に applyAll）
    if (S.style !== 'liberty') switchStyle(S.style); else applyAll();
    syncUi();
    paint();
    map.on('move', paint);
    map.on('render', positionTips);
    map.on('pitchend', syncUi);
    ['dragstart', 'zoomstart', 'rotatestart', 'pitchstart']
      .forEach((ev) => map.on(ev, (e) => { if (e && e.originalEvent) setSheet('short'); }));
    map.on('click', (e) => {
      const layers = [L_BEAM, L_DISC].filter((id) => map.getLayer(id));
      if (!layers.length) return;
      const hit = map.queryRenderedFeatures(e.point, { layers });
      if (hit.length) showCard(D.clubs[hit[0].properties.i]);
    });
  });
  window.addEventListener('resize', () => { map.resize(); positionTips(); });

  // 自分のコードから触るための口（コンソールでも使える）
  window.World3D = {
    state: S, data: D, area: AREA, map,
    applyAll, applyCamera, applyPoints, applyLabels, applyWall, applyBuildings, showCard,
    positionTips,
    visible,
  };
})();
</script>
</body>
</html>
