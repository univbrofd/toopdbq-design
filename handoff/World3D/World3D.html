<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>World3D — 渋谷のナイトクラブのポイント（アプリ実装の 3D マップそのまま）</title>

<!--
  World3D — アプリ（Toopdbq）が画面の背景に敷いている 3D マップ**だけ**を出すページ。
  新機能の「3D 世界」のビジュアルを、モックの絵ではなく**動く地図の上**で考えるための土台。

  出しているデータは**渋谷のナイトクラブ 20 件だけ**（本番 DB の場所 = Places 由来。
  位置・店の写真・ジャンル・営業時間・評価を持つ）。開発用のモック（サークル / 投稿 / お題）は出さない。

  engine / vendor / data は R2（https://media.toopdbq.com/design/world3d/…）から読む。
  engine = アプリ実装（assets/web/earth/*.js）の一方向の写しなので、ここから編集しない。
  新しい 3D 表現は **このページの中**（下の host スクリプトか、その下に足す自分の script）で
  MapLibre の custom layer / three.js として書く。map インスタンスは `map` でグローバルに触れる。

  受け取り方・守る値・戻し方は同じフォルダの HANDOFF.md を読む。
-->
<link rel="stylesheet" href="https://media.toopdbq.com/design/world3d/vendor/maplibre-gl-5.6.0.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
  }

  /* stage = 地図の器。既定は全画面。`body.framed` で実機（iPhone 17・402×874）の枠に収める */
  #stage { position: absolute; inset: 0; overflow: hidden; }
  /* 枠モードは縦に収まらない窓でも切れないようスクロールさせる（transform は使わない。
     scale すると MapLibre のポインタ座標がずれる） */
  body.framed { display: block; overflow: auto; background: #0a0a0e; padding: 20px 0 160px; }
  body.framed #stage {
    position: relative; inset: auto; margin: 0 auto; width: 402px; height: 874px; border-radius: 55px;
    box-shadow: 0 0 0 2px #2a2a31, 0 0 0 12px #0a0a0e, 0 0 0 13px #303039,
                0 36px 90px rgba(0, 0, 0, .62);
  }

  /* --- ここから下 3 つは earth.html（実装）と同じ DOM。engine が id で掴む --- */
  #bg-white { position: absolute; inset: 0; background: #000; z-index: 0; }
  #map { position: absolute; inset: 0; background: transparent; z-index: 2; }
  #center-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 3; overflow: visible;
  }
  #center-marker-glow { filter: blur(4px); }
  .maplibregl-canvas-container, .maplibregl-canvas { background: transparent !important; }

  /* --- 店名（このページ固有。DOM マーカー = engine の場所ピンと同じ方式） ---------
     20 点が半径 580m に密集するので今は素の pill。衝突回避はデザインで決める話。 */
  .club-label {
    max-width: 124px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 10px; font-weight: 600; letter-spacing: .01em; line-height: 1;
    padding: 3px 6px; border-radius: 99px; cursor: pointer;
    color: #fff; background: rgba(0, 0, 0, .55);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
  }
  .club-label.lounge { opacity: .62; font-weight: 500; }

  /* --- 素の情報の確認用カード（デザインではない。点が持っている値を見るためだけ） --- */
  #card {
    position: fixed; top: 12px; left: 14px; z-index: 50; width: 260px;
    padding: 10px; border-radius: 12px; font-size: 11px; line-height: 1.55;
    background: rgba(12, 14, 18, .82); border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #card[hidden] { display: none; }
  #card img { width: 100%; height: 96px; object-fit: cover; border-radius: 8px; display: block; }
  #card .nm { font-size: 13px; font-weight: 700; margin: 7px 0 2px; }
  #card .kv { opacity: .66; }
  #card a { color: #ff3e88; }
  #card .x { position: absolute; top: 6px; right: 8px; cursor: pointer; opacity: .6; font-size: 14px; }

  /* --- サンドボックスの操作盤（デザインではない。提案では消してよい） --- */
  #sandbox {
    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 10px 12px; border-radius: 16px;
    background: rgba(12, 14, 18, .72); border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 11px; letter-spacing: .02em;
  }
  #sandbox[hidden] { display: none; }
  #sandbox .grp { display: flex; align-items: center; gap: 4px; }
  #sandbox .lbl { opacity: .5; margin-right: 2px; }
  #sandbox button {
    appearance: none; border: 1px solid rgba(255, 255, 255, .18); color: #fff;
    background: rgba(255, 255, 255, .06); border-radius: 99px; padding: 5px 10px;
    font: inherit; cursor: pointer; white-space: nowrap;
  }
  #sandbox button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }
  #sandbox input[type="range"] { width: 76px; accent-color: #fff; }
  #sandbox .sep { width: 1px; height: 16px; background: rgba(255, 255, 255, .16); }
  #hint { opacity: .45; }
  #fold { margin-left: auto; width: 24px; padding: 4px 0; text-align: center; }
  #unfold {
    position: fixed; left: 12px; bottom: 12px; z-index: 50; font: inherit; font-size: 11px;
    color: #fff; background: rgba(12, 14, 18, .72); border: 1px solid rgba(255, 255, 255, .14);
    border-radius: 99px; padding: 7px 12px; cursor: pointer;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #readout {
    position: fixed; top: 12px; right: 14px; z-index: 50; font-size: 11px;
    font-variant-numeric: tabular-nums; opacity: .55; text-align: right; line-height: 1.5;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
  }
</style>
</head>
<body>

<div id="stage">
  <div id="bg-white"></div>
  <div id="map"></div>
  <!-- 地図中心の装飾（青ドット）。engine（overlay.js）が cx/cy/ry を毎イベント更新する -->
  <svg id="center-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <ellipse id="center-marker-glow" cx="0" cy="0" rx="0" ry="0" fill="rgba(66,133,244,0.33)" />
    <ellipse id="center-marker" cx="0" cy="0" rx="10" ry="10"
             fill="rgba(66,133,244,0.80)" stroke="#FFFFFF" stroke-width="1.2" />
  </svg>
</div>

<div id="readout"></div>
<div id="card" hidden></div>

<div id="sandbox">
  <div class="grp"><span class="lbl">スタイル</span>
    <button data-act="style" data-v="dark">Dark</button>
    <button data-act="style" data-v="liberty">Liberty</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">Pitch</span>
    <button data-act="pitch" data-v="0">0</button>
    <button data-act="pitch" data-v="35">35</button>
    <button data-act="pitch" data-v="55">55</button>
    <button data-act="pitch" data-v="60">60</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">ポイント</span>
    <button data-act="points" data-v="beam">光の柱</button>
    <button data-act="points" data-v="photo">写真</button>
    <button data-act="points" data-v="pin">マーカー</button>
    <button data-act="points" data-v="off">なし</button>
  </div>
  <div class="grp"><span class="lbl">要素</span>
    <button data-act="toggle" data-v="labels">店名</button>
    <button data-act="toggle" data-v="clubOnly">クラブだけ</button>
    <button data-act="toggle" data-v="wall">クラブ街の壁</button>
    <button data-act="toggle" data-v="buildings">3D ビル</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><span class="lbl">地図の明度</span>
    <input id="dim" type="range" min="0" max="1" step="0.05">
  </div>
  <div class="grp"><span class="lbl">枠</span>
    <button data-act="frame" data-v="0">全画面</button>
    <button data-act="frame" data-v="1">iPhone 17</button>
  </div>
  <span id="hint">ドラッグ=移動 / ホイール=ズーム / 右ドラッグ・2 本指=回転と傾き / 点をタップ=情報</span>
  <button id="fold" title="操作盤をしまう">×</button>
</div>
<button id="unfold" hidden>操作盤</button>

<!-- vendor: アプリが同梱しているものと同一版（MapLibre GL JS 5.6.0） -->
<script src="https://media.toopdbq.com/design/world3d/vendor/maplibre-gl-5.6.0.js"></script>
<!-- data: 本番 DB の場所（placeDetails）から渋谷のナイトクラブだけを抜いた生成物 -->
<script src="https://media.toopdbq.com/design/world3d/data.js?v=0861fdab"></script>
<!-- engine: アプリ実装 assets/web/earth/*.js の写し。読み込み順は earth.html と同じ -->
<script src="https://media.toopdbq.com/design/world3d/engine/bridge.js?v=0861fdab"></script>
<script src="https://media.toopdbq.com/design/world3d/engine/map-core.js?v=0861fdab"></script>
<script src="https://media.toopdbq.com/design/world3d/engine/pins.js?v=0861fdab"></script>
<script src="https://media.toopdbq.com/design/world3d/engine/circles.js?v=0861fdab"></script>
<script src="https://media.toopdbq.com/design/world3d/engine/overlay.js?v=0861fdab"></script>
<script src="https://media.toopdbq.com/design/world3d/engine/places.js?v=0861fdab"></script>

<script>
// ============================================================================
// host — 実機で Flutter がやっている役（カメラ操作・データ投入・指の入力）の代役。
// アプリでは WebView がタッチを受けず Flutter が全部送るので、engine 側は
// MapLibre の標準ハンドラを切っている。ここではサンドボックスなので触れるように戻す。
// ============================================================================
(function () {
  const D = window.World3DData || {};
  if (!Array.isArray(D.clubs)) D.clubs = [];
  const STATION = Number.isFinite(D.station?.lat) ? D.station : { lat: 35.658034, lng: 139.701636 };
  const AREA = Number.isFinite(D.area?.lat)
    ? D.area
    : { lat: STATION.lat, lng: STATION.lng, radiusMeters: 500, label: '渋谷' };
  const P = new URLSearchParams(location.search);
  const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) ? v : d; };
  const on = (k, d) => (P.get(k) == null ? d : P.get(k) !== '0');

  // URL クエリで初期状態を指定できる
  // （?style=liberty&pitch=60&points=photo&labels=0&wall=1&buildings=0&clubonly=1&framed=1&zoom=17&bearing=30&dim=.6）
  const S = {
    zoom: num('zoom', 15.8),
    pitch: num('pitch', 55),
    bearing: num('bearing', 0),
    style: P.get('style') === 'liberty' ? 'liberty' : 'dark',   // 夜の街が主題なので既定は dark
    points: ['beam', 'photo', 'pin', 'off'].includes(P.get('points')) ? P.get('points') : 'beam',
    labels: on('labels', true),
    clubOnly: on('clubonly', false),
    wall: on('wall', false),
    buildings: on('buildings', true),
    dim: num('dim', 1),
    framed: P.get('framed') === '1',
  };

  const stage = document.getElementById('stage');
  const readout = document.getElementById('readout');
  const card = document.getElementById('card');
  // style の読み込み完了待ち。MapLibre は style 切替の途中でも idle を撃つので、
  // isStyleLoaded() を見張る（途中で addSource すると "Style is not done loading" で落ちる）。
  const whenReady = (fn) => {
    const tick = () => (map.isStyleLoaded() ? fn() : setTimeout(tick, 120));
    tick();
  };
  // 出す点。kind: 'club' = 踊る箱 / 'lounge' = 型が lounge_bar 等で拾われた夜の店
  const visible = () => D.clubs.filter((c) => !S.clubOnly || c.kind === 'club');

  // --- カメラ（engine の公開 API。実機と同じ入口） ---------------------------
  function applyCamera() {
    window.setCenter(AREA.lat, AREA.lng);
    window.setCamera({ zoom: S.zoom });
    window.setPitch(S.pitch);
    map.jumpTo({ bearing: S.bearing });
  }
  // engine は起動時に一度だけ「初回カメラ確定」で URL クエリの既定（zoom 6.4・東京駅）へ
  // jumpTo する（style.load / 即時ガード / 1s ポーリングの三重なので発火の順が読めない）。
  // ページの構図がそれに負けないよう、指が触るまでの数秒だけ当て直す。engine の確定は
  // 一度きりなので必ず収束する。
  let camHeld = false;
  function holdCamera(ms) {
    const t0 = Date.now();
    const tick = () => {
      if (camHeld) return;
      const c = map.getCenter();
      const off = Math.abs(c.lat - AREA.lat) > 1e-4 || Math.abs(c.lng - AREA.lng) > 1e-4
        || Math.abs(map.getZoom() - S.zoom) > 0.02 || Math.abs(map.getPitch() - S.pitch) > 0.5;
      if (off) applyCamera();
      if (Date.now() - t0 < ms) setTimeout(tick, 150);
    };
    ['dragstart', 'wheel', 'touchstart', 'pitchstart', 'rotatestart']
      .forEach((ev) => map.on(ev, () => { camHeld = true; }));
    tick();
  }

  // --- ポイント（このページ固有の層 = 新機能の「点」の素） -------------------
  // 光の柱: 地点に半径 7m の多角形を置いて fill-extrusion で 60m 立てる + 地面のにじみ。
  // 高さ・色を data の値（rating / ratingCount / overnight / closeHour）で振るのはデザインの判断。
  const SRC_PT = 'w3d-club-pts', SRC_BEAM = 'w3d-club-beams';
  const L_DISC = 'w3d-club-disc', L_BEAM = 'w3d-club-beam';
  const POINT_COLOR = '#ff3e88';  // DS の --state-like / --grad-pink（アプリの唯一のアクセント）
  const BEAM_R_M = 7, BEAM_H_M = 60;

  function discRing(lat, lng, rM, seg) {
    const dLat = rM / 111320, dLng = rM / (111320 * Math.cos(lat * Math.PI / 180));
    const ring = [];
    for (let i = 0; i <= seg; i++) {
      const t = (i / seg) * Math.PI * 2;
      ring.push([lng + Math.cos(t) * dLng, lat + Math.sin(t) * dLat]);
    }
    return [ring];
  }
  const feat = (c, geometry) => ({
    type: 'Feature',
    properties: { i: D.clubs.indexOf(c), kind: c.kind, h: BEAM_H_M },
    geometry,
  });
  const ptGeo = (list) => ({
    type: 'FeatureCollection',
    features: list.map((c) => feat(c, { type: 'Point', coordinates: [c.lng, c.lat] })),
  });
  const beamGeo = (list) => ({
    type: 'FeatureCollection',
    features: list.map((c) => feat(c, { type: 'Polygon', coordinates: discRing(c.lat, c.lng, BEAM_R_M, 12) })),
  });
  function setGeo(id, geo) {
    const src = map.getSource(id);
    if (src) src.setData(geo);
    else map.addSource(id, { type: 'geojson', data: geo });
  }
  function ensurePointLayers() {
    if (!map.getLayer(L_DISC)) {
      map.addLayer({
        id: L_DISC, type: 'circle', source: SRC_PT,
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 2.5, 16, 7, 18, 14],
          'circle-color': POINT_COLOR,
          'circle-opacity': ['case', ['==', ['get', 'kind'], 'club'], 0.9, 0.55],
          'circle-blur': 0.6,
        },
      });
    }
    if (!map.getLayer(L_BEAM)) {
      map.addLayer({
        id: L_BEAM, type: 'fill-extrusion', source: SRC_BEAM,
        paint: {
          'fill-extrusion-color': POINT_COLOR,
          'fill-extrusion-height': ['get', 'h'],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.45,
        },
      });
    }
  }
  let labelMarkers = [];
  function applyLabels() {
    labelMarkers.forEach((m) => m.remove());
    labelMarkers = [];
    if (!S.labels || S.points === 'off') return;
    for (const c of visible()) {
      const el = document.createElement('div');
      el.className = 'club-label' + (c.kind === 'club' ? '' : ' lounge');
      el.textContent = c.name;
      el.addEventListener('click', (e) => { e.stopPropagation(); showCard(c); });
      labelMarkers.push(new maplibregl.Marker({
        // 写真タイル（36）の下に出す。柱 / マーカーのときは地点のすぐ下
        element: el, anchor: 'top', offset: [0, S.points === 'photo' ? 22 : 10],
        pitchAlignment: 'viewport', rotationAlignment: 'viewport',
      }).setLngLat([c.lng, c.lat]).addTo(map));
    }
  }
  function applyPoints() {
    if (!map.isStyleLoaded()) { whenReady(applyPoints); return; }
    const list = visible();
    // 写真 / マーカーは engine の場所ピン（アプリの既存ボキャブラリそのもの）
    if (S.points === 'photo' || S.points === 'pin') {
      window.setPlacePins({
        pins: list.map((c) => ({ key: c.key, lat: c.lat, lng: c.lng, imageUrl: c.imageUrl })),
        style: S.points === 'photo' ? 'tile' : 'pin',
      });
    } else {
      window.clearPlacePins();
    }
    const beam = S.points === 'beam' ? list : [];
    setGeo(SRC_PT, ptGeo(beam));
    setGeo(SRC_BEAM, beamGeo(beam));
    ensurePointLayers();
    applyLabels();
  }

  // --- クラブ街の壁（アプリ既存の 3D ボキャブラリ。点の範囲から出した円） -----
  function applyWall() {
    if (!S.wall) { window.clearCircleFocusArea(); return; }
    window.setCircleFocusArea({
      lat: AREA.lat, lng: AREA.lng, radiusMeters: AREA.radiusMeters,
      // 実機は画面比で渡す（下に一覧やシートが来る構図。ここは画面高の 23% を上に空ける）
      padTop: Math.round(stage.clientHeight * 0.23), padBottom: 0,
      label: AREA.label,
    });
  }

  // 3D ビル。liberty には style 標準の building-3d があるが dark には fill-extrusion が
  // 1 枚も無い（openfreemap dark の仕様）ので、同じ vector source から自前で立てる。
  const OWN_BUILDINGS = 'w3d-buildings';
  function applyBuildings() {
    if (!map.isStyleLoaded()) { whenReady(applyBuildings); return; }
    const own = map.getLayer(OWN_BUILDINGS);
    if (S.style === 'dark') {
      if (S.buildings && !own) {
        map.addLayer({
          id: OWN_BUILDINGS, type: 'fill-extrusion', source: 'openmaptiles',
          'source-layer': 'building', minzoom: 14,
          paint: {
            'fill-extrusion-color': '#1c2029',
            'fill-extrusion-height': ['get', 'render_height'],
            'fill-extrusion-base': ['get', 'render_min_height'],
            'fill-extrusion-opacity': 0.9,
          },
        }, map.getLayer(L_DISC) ? L_DISC : undefined); // 点はビルより手前
        applyWall(); // 壁は常に最前面（circles.js が layer を持ち上げ直す）
      } else if (!S.buildings && own) {
        map.removeLayer(OWN_BUILDINGS);
      }
      return;
    }
    if (own) map.removeLayer(OWN_BUILDINGS);
    for (const l of (map.getStyle().layers || [])) {
      if (l.type !== 'fill-extrusion' || l.id === L_BEAM) continue;
      try { map.setLayoutProperty(l.id, 'visibility', S.buildings ? 'visible' : 'none'); } catch (_) {}
    }
  }

  // setMapStyle は style 由来の layer / source / image を捨てるので、読み込み完了後に貼り直す。
  function switchStyle(name) {
    window.setMapStyle(name);
    whenReady(() => { applyAll(); syncUi(); });
  }
  function applyAll() {
    applyPoints(); applyWall(); applyBuildings();
    window.setMapDim(S.dim);
  }

  // --- 点が持っている値の確認（デザインではない） ----------------------------
  function showCard(c) {
    const kv = [];
    if (c.genreLabel || c.genre) kv.push(`${c.genreLabel || c.genre}${c.kind === 'club' ? '' : '（型で拾った夜の店）'}`);
    if (c.rating != null) kv.push(`★ ${c.rating}（${c.ratingCount ?? 0} 件）`);
    if (c.open) kv.push(`${c.open}–${c.close || '?'}${c.overnight ? ' 深夜' : ''}`);
    if (c.address) kv.push(c.address);
    kv.push(`渋谷駅から ${c.distanceM}m`);
    card.innerHTML = `<span class="x">×</span>`
      + (c.imageUrl ? `<img src="${c.imageUrl}" alt="">` : '')
      + `<div class="nm">${c.name}</div><div class="kv">${kv.join('<br>')}</div>`
      + (c.mapsUrl ? `<div class="kv"><a href="${c.mapsUrl}" target="_blank" rel="noopener">Google マップ</a></div>` : '');
    card.hidden = false;
    card.querySelector('.x').addEventListener('click', () => { card.hidden = true; });
  }

  // --- 指の入力（実機では Flutter が送る。ここは MapLibre のハンドラを戻す） ---
  function enableInput() {
    ['scrollZoom', 'dragPan', 'dragRotate', 'touchZoomRotate', 'touchPitch', 'keyboard', 'doubleClickZoom']
      .forEach((k) => { try { map[k] && map[k].enable(); } catch (_) {} });
  }

  // --- 操作盤 ---------------------------------------------------------------
  function syncUi() {
    document.querySelectorAll('#sandbox button').forEach((b) => {
      const act = b.dataset.act, v = b.dataset.v;
      const pressed =
        act === 'style' ? S.style === v :
        act === 'pitch' ? Math.round(map.getPitch()) === Number(v) :
        act === 'points' ? S.points === v :
        act === 'frame' ? (S.framed ? v === '1' : v === '0') :
        act === 'toggle' ? !!S[v] : false;
      b.setAttribute('aria-pressed', String(pressed));
    });
    document.getElementById('dim').value = String(S.dim);
  }
  document.getElementById('sandbox').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const { act, v } = b.dataset;
    if (act === 'style') { S.style = v; switchStyle(v); }
    if (act === 'pitch') { S.pitch = Number(v); window.setPitch(S.pitch); }
    if (act === 'points') { S.points = v; applyPoints(); }
    if (act === 'frame') {
      S.framed = v === '1';
      document.body.classList.toggle('framed', S.framed);
      requestAnimationFrame(() => { map.resize(); applyWall(); });
    }
    if (act === 'toggle') {
      S[v] = !S[v];
      if (v === 'labels') applyLabels();
      if (v === 'clubOnly') applyPoints();
      if (v === 'wall') applyWall();
      if (v === 'buildings') applyBuildings();
    }
    syncUi();
  });
  const panel = document.getElementById('sandbox');
  const unfold = document.getElementById('unfold');
  document.getElementById('fold').addEventListener('click', () => {
    panel.hidden = true; unfold.hidden = false; readout.hidden = true;
  });
  unfold.addEventListener('click', () => {
    panel.hidden = false; unfold.hidden = true; readout.hidden = false;
  });
  document.getElementById('dim').addEventListener('input', (e) => {
    S.dim = Number(e.target.value); window.setMapDim(S.dim);
  });

  // --- カメラの数値を右上に出す（構図を決めるときの物差し） -------------------
  function paint() {
    const c = map.getCenter();
    readout.textContent =
      `zoom ${map.getZoom().toFixed(2)}  pitch ${map.getPitch().toFixed(0)}°  bearing ${map.getBearing().toFixed(0)}°\n`
      + `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}  /  ポイント ${visible().length}`;
    readout.style.whiteSpace = 'pre';
  }

  // --- 起動 -----------------------------------------------------------------
  document.body.classList.toggle('framed', S.framed);
  whenReady(() => {
    enableInput();
    applyCamera();
    holdCamera(3000);
    // ?style=… が liberty 以外なら style.load を待ってから貼る（switchStyle が完了後に applyAll）
    if (S.style !== 'liberty') switchStyle(S.style); else applyAll();
    syncUi();
    paint();
    map.on('move', paint);
    map.on('pitchend', syncUi);
    map.on('click', (e) => {
      const layers = [L_BEAM, L_DISC].filter((id) => map.getLayer(id));
      if (!layers.length) return;
      const hit = map.queryRenderedFeatures(e.point, { layers });
      if (hit.length) showCard(D.clubs[hit[0].properties.i]);
    });
  });
  window.addEventListener('resize', () => { map.resize(); });

  // 自分のコードから触るための口（コンソールでも使える）
  window.World3D = {
    state: S, data: D, area: AREA, map,
    applyAll, applyCamera, applyPoints, applyLabels, applyWall, applyBuildings, showCard,
    visible,
  };
})();
</script>
</body>
</html>
