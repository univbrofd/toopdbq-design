<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toopdbq — Drafts</title>
<link rel="stylesheet" href="../DesignSystem/colors_and_type.css">
<style>
  /* 下書き一覧 — 実装 lib/feature/DraftList/ の画面だけ再現（3 列グリッド・タップで編集再開） */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: var(--font-jp); }

  .screen {
    position: relative; overflow: hidden; background: #000;
    width: min(100vw, calc(100dvh * 402 / 874)); height: 100dvh;
    display: flex; flex-direction: column;
  }

  .nav {
    flex: none; position: relative; z-index: 2;
    display: grid; grid-template-columns: 56px 1fr 56px; align-items: center;
    padding: 66px 8px 16px; background: #000;
  }
  .nav .back { grid-column: 1; border: none; background: none; cursor: pointer;
    display: grid; place-items: center; height: 40px; }
  .nav .title { grid-column: 2; text-align: center; font: 700 17px/1 var(--font-jp); color: #fff; }

  .grid {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    align-content: start;
  }
  .cell { position: relative; aspect-ratio: 2 / 3; background: #17171a; overflow: hidden; cursor: pointer; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .when {
    position: absolute; left: 8px; bottom: 8px;
    font: 600 10.5px/1 var(--font-latin); color: rgba(255,255,255,.85);
    text-shadow: 0 1px 4px rgba(0,0,0,.7);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="nav">
      <button class="back" aria-label="戻る">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M12.5 3 6 10l6.5 7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="title">下書き</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
<script>
  const IDX = [3, 7, 11, 1, 5, 9, 14, 2];
  const WHEN = ['今日', '今日', '昨日', '昨日', '8/19', '8/18', '8/16', '8/12'];
  document.getElementById('grid').innerHTML = IDX.map((i, k) =>
    '<div class="cell"><img src="../assets/sample/reel/reel' + String(i).padStart(3, '0')
    + '.jpg" alt=""><span class="when">' + WHEN[k] + '</span></div>').join('');
</script>
</body>
</html>
