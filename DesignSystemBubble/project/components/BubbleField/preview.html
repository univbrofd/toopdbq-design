<!doctype html><html lang="ja" data-theme="dark"><head><meta charset="utf-8"><title>BubbleField</title><style>
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.w{width:402px;padding-bottom:16px}
.phone{position:relative;width:402px;height:874px;overflow:hidden;transform:translateZ(0)}
.phone > .tp{min-height:0;height:874px}
.logo-gap{display:block;width:127px;height:34px}
.cap{display:block;margin:8px 16px 0;font-size:11px;line-height:1.45;color:var(--fg3)}
</style></head><body><div class="w">
<div class="phone">
  <div class="app tp tm">
    <div class="tm-map"></div>
    <button type="button" class="tm-locb" aria-busy="false" aria-label="現在地へ戻る"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.5 3.5 3.8 10.6l6.9 2.7 2.7 6.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
    <div class="tm-moveb"><button type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="探す範囲: 徒歩"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg></button></div>
    <div class="tm-sky"></div>
    <header class="tp-brand"><span class="logo-gap" aria-hidden="true"></span></header>
    <div class="tm-field thru">
      <canvas class="tm-cv"></canvas>
      <h1>何したい？</h1>
      <div class="tm-sr"><button type="button">プランを考える</button></div>
    </div>
  </div>
  <nav class="tn"><button type="button" aria-label="ホーム" aria-current="page"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" aria-label="プラン一覧"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 6.5h14a1.5 1.5 0 0 1 1.5 1.5v10.5A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5V8A1.5 1.5 0 0 1 5 6.5zM3.5 10.5h17M8 4v5M16 4v5M8.5 15l2.2 2.2 4.6-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" aria-label="保存したお店"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.4-6.5 4.4v-16a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></nav>
</div>
<span class="cap">canvas の 1 コマ（bubbles.ts の描き方と落ち着き先の計算をそのまま）。上端 44px = ロゴ（文字）の場所（画像は同梱なし）。裏の夜の 3D の地図と街の泡は省略。お買い物 / 公園 / 遊び は絵が同梱に無いので、絵の無い玉の描き方（絵文字 + 言葉）。下端: 移動手段 .tm-moveb / 現在地 .tm-locb / アプリバー .tn</span>
</div>
<script>
(() => {
  // [id, label, face, emoji, kind(big|title|act|''), x, y, r] in .tm-field px。落ち着き先 = bubbles.ts の packHomes（spread）を同じ数値・乱数の種 7 で回した 1 回分（fit 0.833）
  const B = [
    ['hyakumeiten', '2026年 100名店', '../img/faces/hyakumeiten.webp', '', 'big', 111.1, 415, 86.4],
    ['cafe', 'カフェ', '../img/faces/snack.coffee.webp', '☕', '', 196.2, 565.8, 59.1],
    ['sweets', 'スイーツ', '../img/faces/snack.sweets.webp', '🍰', '', 64, 585.1, 56],
    ['shopping', 'お買い物', null, '🛍️', '', 336.6, 551.5, 54.5],
    ['lunch', 'ランチ', '../img/faces/lunch.ramen.webp', '🍱', '', 65.9, 211.2, 55.2],
    ['dinner', 'ディナー', '../img/faces/dinner.webp', '🍖', '', 335.5, 192.9, 58.5],
    ['photo', '映え\u200bスポット', '../img/faces/sight.famous.webp', '📷', '', 240.3, 128.9, 53.6],
    ['movies', '映画', '../img/faces/culture.movies.webp', '🎬', '', 330.3, 64.9, 53.9],
    ['park', '公園', null, '🌿', '', 54.4, 54.4, 46.4],
    ['g:play', '遊び', null, '🎮', '', 168.2, 54.9, 46.9],
    ['sauna', 'サウナ・\u200bスパ', '../img/faces/sauna.webp', '🧖', '', 280.5, 641, 48.1],
    ['drink', 'お酒', '../img/faces/bar.beer.webp', '🍺', '', 138.7, 651.2, 40.8],
    ['talk', '新しい\u200b友達', '../img/faces/talk.webp', '💬', '', 110.9, 124, 40.1],
    ['__title', '何したい？', null, '', 'title', 201, 266.3, 86.4],
    ['__plan', 'プランを\u200b考える', '../img/faces/plan.webp', '', 'act', 290.9, 415, 86.4],
  ];
  const RING = 0.94, BREAK = '\u200b';
  const field = document.querySelector('.tm-field'), cv = field.querySelector('.tm-cv');
  const W = field.clientWidth, H = field.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const cx = cv.getContext('2d'), font = getComputedStyle(document.body).fontFamily;
  const load = (src) => new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
  const good = (im) => !!im && im.naturalWidth > 0;
  function wrap(g, text, maxW, lh, y0) {
    const lines = [];
    for (const part of text.split(BREAK)) {
      let line = '';
      for (const c of /\s/.test(part) ? part.split(/(?<=\s)/) : Array.from(part)) {
        const test = line + c;
        if (g.measureText(test.trimEnd()).width > maxW && line) { lines.push(line.trimEnd()); line = c; } else line = test;
      }
      lines.push(line.trimEnd());
    }
    const use = lines.slice(0, 3), y = y0 - (use.length - 1) * lh / 2;
    use.forEach((l, i) => g.fillText(l, 0, y + i * lh));
  }
  // bubbles.ts sprite(): 中身の絵を丸く切り抜いて中央ほど暗く → 泡の画像を 1/0.94 倍で重ねる → 白い太字の言葉（影 .85）
  function sprite(b, ring) {
    const tr = b.r, s = tr / RING, S = Math.ceil(s * 2 * dpr), placed = !!b.kind;
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, S / 2, S / 2);
    const face = good(b.im);
    if (face) {
      g.save(); g.beginPath(); g.arc(0, 0, tr * 0.98, 0, Math.PI * 2); g.clip();
      g.drawImage(b.im, -tr, -tr, tr * 2, tr * 2);
      const shade = g.createRadialGradient(0, 0, 0, 0, 0, tr);
      shade.addColorStop(0, 'rgba(0,0,0,.5)'); shade.addColorStop(0.7, 'rgba(0,0,0,.28)'); shade.addColorStop(1, 'rgba(0,0,0,.08)');
      g.fillStyle = shade; g.fillRect(-tr, -tr, tr * 2, tr * 2); g.restore();
    }
    if (good(ring)) g.drawImage(ring, -s, -s, s * 2, s * 2);
    else { g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 1.5; g.beginPath(); g.arc(0, 0, tr, 0, Math.PI * 2); g.stroke(); }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    if (!face && !placed) { g.font = `${Math.round(tr * 0.42)}px sans-serif`; g.fillText(b.emoji, 0, -tr * 0.36); }
    const maxW = tr * 1.6, parts = b.label.split(BREAK);
    g.font = `700 100px ${font}`;
    const w100 = Math.max(1, ...parts.map((p) => g.measureText(p).width));
    const rows = placed && parts.length === 1 && /\s/.test(b.label) ? 1.8 : 1;
    let fs = Math.min(tr * (b.kind === 'title' ? 0.34 : b.kind === 'act' || parts.length > 1 ? 0.32 : 0.28), maxW * rows * 100 / w100);
    if (fs < 10) fs = Math.max(10, Math.min(tr * 0.27, maxW * 2 * 0.9 * 100 / w100));
    g.font = `700 ${fs}px ${font}`;
    g.shadowColor = 'rgba(0,0,0,.85)'; g.shadowBlur = 6;
    if (b.label) wrap(g, b.label, maxW, fs * 1.15, face || placed ? 0 : tr * 0.14);
    return c;
  }
  const balls = B.map(([id, label, face, emoji, kind, x, y, r]) => ({ id, label, face, emoji, kind, x, y, r }));
  Promise.all([load('../img/bubble.webp'), ...balls.map((b) => (b.face ? load(b.face) : null))]).then(([ring, ...ims]) => {
    balls.forEach((b, i) => { b.im = ims[i]; });
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 漂う玉が先、見出し・操作・big の玉が手前
    [...balls.filter((b) => !b.kind), ...balls.filter((b) => b.kind)].forEach((b) => {
      const sp = sprite(b, ring), s = b.r / RING;
      cx.drawImage(sp, b.x - s, b.y - s, s * 2, s * 2);
    });
  });
})();
</script>
</body></html>
