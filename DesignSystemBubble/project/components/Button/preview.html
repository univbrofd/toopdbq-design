<!-- @dsCard group="Controls" width=402 height=568 subtitle="泡の絵を横に伸ばしたカプセル .pl-pill: 主（wide）・静か（quiet）・並び・小（quiet sm）・無効・共有・決定（fl-go）" -->
<!doctype html><html lang="ja" data-theme="dark"><head><meta charset="utf-8"><title>Button</title><style>
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.w{width:402px;padding:20px 16px;display:grid;gap:12px}
.pair{display:flex;gap:10px}.pair .pl-pill{flex:1}
.mid{display:flex;align-items:center;justify-content:center;gap:12px}
.mid .pl-more{margin:0}
.cap{margin-top:-4px;font-size:11px;line-height:1.45;color:var(--fg3)}
</style></head><body><div class="w">
<a class="pl-pill wide" href="#"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>歩くルートを見る</a>
<span class="cap">主 .pl-pill.wide = 泡の絵を 9 スライスで伸ばした皮（--bw 25 = 高さの半分）+ 黒 .18 の面（高さ 50・16px 700）</span>
<button class="pl-pill quiet wide" type="button">最初からやり直す</button>
<span class="cap">静か .quiet = 泡の輪を .55 に薄める・面なし・600</span>
<div class="pair"><button class="pl-pill" type="button">もう一度</button><button class="pl-pill quiet" type="button">条件を変える</button></div>
<span class="cap">並び（失敗したときの 2 つ）= 主 + 静か を半分ずつ</span>
<div class="mid"><button class="pl-pill quiet sm pl-more" type="button">もっと見る</button><button class="pl-pill" type="button" disabled>もう一度</button></div>
<span class="cap">小 .quiet.sm（高さ 34・13px）/ 無効 :disabled（不透明度 .4）</span>
<div class="mid"><button class="pl-pill" type="button" style="background:var(--bub-on);box-shadow:var(--bub-glow)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11M8 7.5l4-4 4 4M5.5 11.5v8h13v-8"/></svg>共有</button></div>
<span class="cap">強調 = 面 bubble-on（白 .2）+ shadow-halo</span>
<button class="pl-pill fl-go" type="button">決定</button>
<span class="cap">決定 .fl-go = 幅いっぱい・800（全部の段を選んだ後）</span>
</div></body></html>
