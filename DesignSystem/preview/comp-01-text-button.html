<!-- @dsCard group="Components" tier="component" name="WdTextButton" subtitle="Primary CTA · ダーク透過ガラス面（うっすら黒・背景が透ける）＋テーマカラーの枠 · types: canonical / it(icon+label) · glass: yes" --><!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="components.css">
<style>
  body { background:#0d0d0f; gap:16px; }
  .lede { font:500 12px/1.7 var(--font-jp); color:var(--text-2); max-width:740px; }
  .lede b { color:#fff; font-weight:700; }
  .tok { display:inline-block; font:600 10px var(--font-latin); color:var(--text-2);
    background:rgba(255,255,255,.06); border-radius:5px; padding:2px 6px; margin:0 1px; }
  .ch { font:700 10px/1 var(--font-latin); letter-spacing:.13em; text-transform:uppercase; color:#7ee0a0; }
  .stage { position:relative; border-radius:var(--radius-md); overflow:hidden; padding:34px 28px;
    display:flex; flex-direction:row; align-items:center; justify-content:center; gap:26px; max-width:740px;
    background:url('../../assets/sample/background/background016.jpg') center 60%/cover; }
  .stage .veil { position:absolute; inset:0; background:rgba(0,0,0,.34); }
  .stage > * { position:relative; }
</style></head>
<body>
  <div class="eyebrow">Primary CTA — WdTextButton（ダーク透過ガラス＋テーマカラーの枠）</div>
  <div class="row" style="gap:8px;"><span class="glass-tag">glass: yes — うっすら黒の透過面（背景が透ける）</span></div>
  <div class="lede"><b>改定: ベタ塗りを廃し、ダーク透過ガラス面へ。</b>面は <span class="tok">--lg-tint-dark</span>（うっすら黒・<span class="tok">backdrop blur</span> で背景が透ける）。カラフルなテーマアクセント <span class="tok">--gradient-colorful</span> は<b>枠（2px の rim）</b>として見せ、塗りには使わない。</div>

  <div class="ch">canonical — 主要 CTA</div>
  <div class="stage" style="flex-direction:column; gap:12px;">
    <div class="veil"></div>
    <button class="wd-text-btn">このサークルを選択</button>
  </div>

  <div class="ch">同語彙のテキストボタン — WdItBtn（icon+label）</div>
  <div class="stage" style="padding:30px 22px;">
    <div class="veil"></div>
    <button class="wd-it-btn"><img src="../../assets/icons/icon_pin.png" alt="">ここに投稿</button>
  </div>

</body></html>
