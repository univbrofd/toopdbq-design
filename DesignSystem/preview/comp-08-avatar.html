<style> body { background: linear-gradient(135deg,#2a2440,#101019); gap:18px; } .u{display:flex;flex-direction:column;align-items:center;gap:9px;} .u .n{font-size:10px;color:var(--fg-2);} </style>
</head>
<body>
  <div class="eyebrow">Avatar + relation badge — edit · follow · following · message</div>
  <div class="row" style="gap:8px;"><span class="glass-tag no">glass: no — 画像要素</span></div>
  <div class="row" style="justify-content:space-around;margin-top:4px;">
    <div class="u"><div class="wd-avatar"><img src="../../assets/sample/user/user006.jpg" style="object-position:50% 30%;"><span class="b"><img src="../../assets/icons/icon_edit.png"></span></div><span class="n">self · edit</span></div>
    <div class="u"><div class="wd-avatar"><img src="../../assets/sample/user/user003.jpg" style="object-position:50% 30%;"><span class="b"><img src="../../assets/icons/icon_add.png"></span></div><span class="n">follow</span></div>

    <div class="u"><button class="wd-spesial-icon" style="transform:scale(.92);filter:brightness(.9)"><img src="../../assets/sample/reel/reel007.jpg" alt=""></button><span class="n">pressed</span></div>
  </div>
