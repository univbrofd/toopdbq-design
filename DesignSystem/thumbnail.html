<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:854px;overflow:hidden}
.tile{width:1280px;height:854px;display:flex}
.main{flex:1;background:var(--bg);display:grid;place-items:center}
.main img{width:66%;height:auto;display:block}
.strip{width:320px;height:854px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}
</style></head>
<body>
<div class="tile">
  <div class="main"><img src="../assets/images/logo_toopdbq.png" alt="Toopdbq"></div>
  <div class="strip">
    <span style="background:#fff0a6"></span>
    <span style="background:#ff3e88"></span>
    <span style="background:#d0a052"></span>
    <span style="background:#005f67"></span>
  </div>
</div>
</body></html>
